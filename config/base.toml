# ===========================================================================
# 🔷 DHAN exit-order execution layer (Cluster B, 2026-07-14 — LOCK #1 of
# the 4-lock OFF switch; runbook + lockout contract in
# .claude/rules/project/dhan-exit-order-lockout-2026-07-14.md). While
# enabled = false the app-crate dispatcher drops every exit command
# (counted, never silent). Flipping to true activates DRY-RUN PAPER
# behavior ONLY — the engine's hardcoded dry_run = true blocks every live
# POST, and one boot log line names the mode honestly (a flip is never a
# silent no-op). Going live needs a code change + ratchet edit + rule-file
# edit with a dated operator quote — never a config flip alone. This
# section deliberately EXISTS with enabled = false: it is the lockout
# guard's non-vacuous scan surface (the groww-scale-lockout pattern).
# When enabling: default_freeze_limit_qty (>= 1, the NSE freeze quantity)
# and freeze_limits_reviewed_on ("YYYY-MM-DD", warns when > 90 days old)
# become mandatory; mpp_verify_deadline_secs (default 30) and
# mpp_verify_max_attempts (default 5) drive the verify-after-place ladder.
# ===========================================================================
[exit_orders]
enabled = false

# Cadence scheduler (judge-locked 2026-07-14; reshaped by the operator
# directive 2026-07-16): per-minute POST-CLOSE burst fire timing with
# structural zero-429 gates (pure CAS per-(underlying, expiry) spacing +
# the combined rolling-second cap, monotonic domain), streak-driven shape
# ladders, and event-driven per-(lane, minute) moneyness decisions.
# SHIPS DISABLED: day 1 both lanes run the dry-run logging executor
# (fires logged, Empty returned, NO REST call — decisions honest-skip).
# Flipping `enabled = true` needs the real broker executors (a later PR)
# + the dated rule-file note per
# `.claude/rules/project/cadence-error-codes.md`.
[cadence]
# Native micro-retry hedge + background history re-pull (2026-07-20 operator directive).
native_retry_enabled = true
history_repull_enabled = true
enabled = true # flipped 2026-07-17 — REAL broker executors both lanes (the legacy per-minute legs stand down above per the RS3 mutual exclusion)
# Broker lane gates (fix round 2026-07-17): the cadence REST lanes are
# deliberately INDEPENDENT of the retired live-WS flags
# feeds.dhan_enabled/groww_enabled (false in prod, runtime enable 409'd).
# Config + restart to change — no runtime toggle.
dhan_lane = true
# The Dhan post-close burst second (operator 2026-07-16 "all 7 parallel
# at first second" — the same-day correction): at T + this, ALL 7
# requests fire concurrently — 3 chains (the 3s rule is per-(underlying,
# expiry) only, so different underlyings are concurrent in the
# option-chain API's OWN budget) + all 4 spots (the Data-API bucket,
# 4 <= 5). The shape ladder's rung 1 fallback splits instead: chains in
# second 1, ALL 4 spots in second 2.
#
# 2026-07-31 (operator directive — "check the same 0 milliseconds mechanism
# pull and if it didnt work means alone only right then startign 5 till 300
# try right"): LOWERED 1000 -> 300, the existing house spot floor
# (`spot_min_post_close_ms` below). Measured evidence from the live box the
# same day (QuestDB `spot_1m_rest`, 2026-07-31, 250 minutes, 1000 rows):
# every Dhan spot row landed 1017..1137ms after close (p50 1029, p99 1106)
# — i.e. Dhan's OWN answer time is ~17..137ms and the other 1000ms was
# purely this offset. Within-minute spread across the 4 spots was 13ms
# (p50), proving the 7-request burst is genuinely concurrent.
# Why this is safe (the empty case): a 2xx-empty spot leg ARMS the native
# retry ladder (`native_retry_enabled = true`, offsets
# CADENCE_NATIVE_RETRY_OFFSETS_MS = [2000, 3000, 3800] from the boundary,
# 2026-07-20 operator directive) — so a miss at 300ms is re-fired at
# 2000ms, still inside CADENCE_DECISION_DEADLINE_MS (4000). Worst case is
# therefore NO WORSE than the old 1000ms fire; best case saves ~700ms every
# minute. NOT claimed: that Dhan serves a just-closed minute below 300ms —
# zero empty responses have ever been observed, so the sub-300ms region is
# UNVERIFIED-LIVE and going there needs the spot floor + earlier retry
# rungs (a separate change).
# The serde DEFAULT stays 1000 (fail-safe): an absent [cadence] section
# keeps the old timing.
#
# 2026-07-31 SAME-DAY CORRECTION (operator: "dhan also shdou lfollwo the
# sam eapproach rigth dude which shodul be same and check if an donly if
# the isntant 0 ms fails aloen emans then 5 ms and icnremental check
# approach"): -> 0. BOTH lanes now fire their 7-request volley at the SAME
# instant: Groww at `groww_anchor_offset_ms = 0` (below) and Dhan here at
# 0. An intermediate 5 was NOT symmetry — 5ms is the operator's first
# RETRY step, not the first fire, and it lives in
# CADENCE_NATIVE_RETRY_OFFSETS_MS = [5, 300, 1000, 2000, 3000, 3800].
# `CadenceConfig::validate` was relaxed in the same change from `> 0` to
# `>= 0`: its 2026-07-16 rationale (a T+0 Dhan burst colliding with
# `next_joinable_boundary`'s strictly-in-future rule) does NOT hold, because
# that function anchors on
# `groww_anchor_offset_ms.min(dhan_burst_offset_ms)` and the Groww term is
# ALREADY 0 — so a Dhan 0 changes the computation by nothing. NEGATIVE is
# still refused (that would fire before the minute closes).
dhan_burst_offset_ms = 0
# Rolling-1000ms-window spot gate: at most this many spot requests in ANY
# sliding second (1..=5 — Dhan's Data-API hard cap is 5/sec; the combined
# spot+expiry rolling-second ring is THE binding cadence-lane pacing per
# the 2026-07-16 coordinator ruling — cadence fires do NOT route through
# the shared 3 rps dhan_data_api_limiter, which stays for the legacy
# paths, and chain fires are governed solely by the per-key 3s gate).
spot_window_cap = 4
# Streak thresholds shared by ALL cadence ladders (the 2026-07-16 Dhan
# shape rung 0⇄1, the 2026-07-15 spot-concurrency tiers and the Groww
# fallback-shape ladder; BOTH Assumed — operator confirm pending):
# degrade one step after this many CONSECUTIVE dirty cycles; recover one
# step after this many consecutive fully-clean cycles.
concurrency_degrade_after_dirty_cycles = 2
concurrency_recover_after_clean_cycles = 3
# Spot clamp: spots never fire earlier than T + this.
#
# 2026-07-31 (same operator directive as `dhan_burst_offset_ms` above):
# LOWERED 300 -> 0. The Dhan spot fire instant is
# `max(dhan_burst_offset_ms, spot_min_post_close_ms)`, so ANY value here
# above the burst offset SILENTLY pins every spot later than the chains —
# at 300 the chains would fire at T+0 and the spots at T+300, which is
# exactly the asymmetry the directive removes. 0 keeps all 7 requests in
# ONE simultaneous volley. The serde DEFAULT stays 300 (fail-safe).
spot_min_post_close_ms = 0
# At most one in-cycle retry per failed request, through the gates. A
# RateLimited leg KEEPS its one bounded in-cycle retry (after the per-key
# spacing) — one of the operator's "multiple attempts" before any shape
# demotion (2026-07-16 Correction 2; supersedes the earlier "RateLimited
# never retried" wording, which was the exact inverse).
in_cycle_retry_max = 1
# Lane staleness cutoffs past T: older data is stale for a next-minute fill.
dhan_lane_cutoff_ms = 15000
# Groww fallback-shape ladder (operator verbatim 2026-07-16 two-rung
# prescription + the retained choice-3 last resort): rung 0 (default) =
# all 7 requests in parallel at T+0; rung 1 = :01 all 3 chains / :02 ALL
# 4 spots (VIX included); rung 2 (kept beyond the operator's two-rung
# prescription as the last resort — dated note in
# cadence-error-codes.md) = :01 chains / :02 core spots / :03 VIX alone.
# Verdict = last wave + the burst timeout; 1500ms per request on the
# sequential fallback.
# The structural zero-429 floor: the per-(underlying, expiry) chain gate
# (the 2026-07-16 directive: the broker's 3s rule applies to the SAME
# chain expiry only — different underlyings fire concurrently).
chain_min_spacing_ms = 3000
# Pre-market expiry resolution (operator spec 2026-07-15): bounded retry
# interval per (broker, underlying) expiry-list fetch until the IST
# deadline; past the deadline ONE edge-latched CADENCE-01
# `expiry_unresolved` page per pair episode while background retry
# continues to session end (the deadline gates the PAGE, never attempts).
expiry_retry_interval_ms = 60000
# 08:55:00 IST = 32100 seconds of day (validated within [0, 86400)).
expiry_deadline_secs_of_day_ist = 32100
