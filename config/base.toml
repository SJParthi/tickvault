# Pluggable market-data feed selection. 2026-07-13 operator directive: Dhan live WS feed removed from runtime; Dhan
# retained for REST pulls only (spot_1m_rest / option_chain_1m / historical).
# The Dhan REST retained surface is brought up
# WITHOUT the WS lane by crates/app/src/dhan_rest_stack.rs when
# dhan_enabled = false (Phase A — flip + REST-only bootstrap).
#
# 2026-08-11 — dhan_enabled flipped false -> TRUE. Operator quote, recorded
# verbatim in websocket-connection-scope-lock.md under "2026-08-11 — THE
# DEFAULT IS FLIPPED ON": "switch the dhan feed on espeic llay to cpature all
# tehs eirght dude am i irght dude?".
#
# This is ONE of two gates. `spawn_dhan_feed_stack` also requires the
# TICKVAULT_DHAN_LIVE_FEED=1 env opt-in (set in deploy/systemd/tickvault.service),
# so a local `cargo run` that has not exported it still opens no socket — the
# flag alone does not put sockets into a developer's machine.
#
# It also FORCED [rest_candle_fold] enabled = false further down this file:
# both writers seal into candles_<tf> stamped feed='dhan' under a key that
# cannot separate them, so the lane refuses to open a socket while the fold
# runs. That is not a preference; leaving the fold on makes this flip a no-op.
[feeds]
dhan_enabled = true
# TrueData (feed #4, operator lock 2026-07-24 —
# .claude/rules/project/truedata-feed-scope-2026-07-24.md). The intended
# LIVE-TICK source, but ships DEFAULT-OFF (trial-first): everything is
# code-ready so day 0 of the trial is a config flip, not a build. Flipping
# this default requires a fresh dated operator quote.
truedata_enabled = false

# TrueData (feed #4) connection parameters. All keys are serde-defaulted, so
# an absent [feeds.truedata] section is the disabled day-0 shape. host/port
# come from SSM in production (/tickvault/<env>/truedata/endpoint); the
# user/password are SSM-only Secret<String> and NEVER appear in config.
# port 8086 = the v2.6-doc SANDBOX port (PROD is 8084). Timeframes are
# DERIVED from ticks (mode = "tick") — the 1min/5min bar streams are never
# subscribed. Inert while truedata_enabled = false.
[feeds.truedata]
host = ""
port = 8086
segments = ["nse-eq", "nse-fo", "in"]
mode = "tick"
max_symbols = 0
bidask = true
use_tcp_fallback = false

# [movers] section retired in PR #2 (2026-05-18) alongside the deleted
# movers pipeline. Under the 4-IDX_I-only universe top-N gainers/losers/
