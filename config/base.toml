# ===========================================================================
# REST-era multi-TF candle derivation (operator directive 2026-07-16:
# "why the fuck remaining candles 1m till 1day is not yet generated and
# populated — resolve these"). Folds persist-confirmed spot_1m_rest 1m bars
# into the 1m-derivable candles_* timeframes (1m/3m/5m/15m/1d of the
# 21-frame second-scale set) via the shared seal-writer channel, plus
# a boot catch-up over the last `catchup_days` of stored bars (35 = the
# operator's one-month spot window + weekend slack, 2026-07-16: "our entire
# one month should be stored and fetched from questdb even before
# premarket"). NEVER touches `ticks` (live-feed-purity; rule 10 carries the
# dated candles_1d edit). Serde default is OFF (fail-safe) — this section
# opts in; `enabled = false` is the rollback switch.
#
# 2026-08-11 — DISABLED, forced by the Dhan live-feed flip above. This is a
# MUTUAL EXCLUSION, not a preference: the live lane and this fold both seal
# into the same candles_<tf> tables stamped feed='dhan', and the dedup key
# (ts, security_id, segment, feed) has no column that separates them — every
# column matches for the same minute of the same instrument, so QuestDB
# upserts one over the other with no error and no counter. It would also make
# the 15:31 cross-verification read REST-derived rows as its LIVE side and so
# compare the REST record against itself, agreeing every time, on the one
# check that exists to detect disagreement. `dhan_feed_stack` therefore
# REFUSES to open any socket while this is true.
#
# HONEST COST: the 35-day boot catch-up over stored spot bars stops running.
# Live capture replaces it going FORWARD; it does not backfill the past.
# Re-enabling this means turning the live lane off, until a source
# discriminator is added to the candle dedup key — a schema decision.
# ===========================================================================
[rest_candle_fold]
enabled = false
catchup_days = 35

# ===========================================================================
# RAM residency stores (operator directive 2026-07-16, PR-2 of the
# data-completeness build): the month-deep SPOT bar rings (fed by the
# rest_candle_fold emit path — zero new QuestDB reads) + the current-day
# CHAIN minute ring (fed by the chain legs' publish path, boot-rehydrated
# from today's option_chain_1m rows via bounded /exec windows). Cold path
# only; reads are the FUTURE strategy read contract (§28 boundary — no
# strategy consumer ships). An ABSENT section = disabled (fail-safe);
# `enabled = false` is the rollback switch. RAMSTORE-01 runbook:
# .claude/rules/project/ram-store-error-codes.md
# ===========================================================================
[market_ram_store]
enabled = true
# CURRENT DAY (operator directive 2026-08-12, stated three times: "for the
# entire current day ram will not even cross more than max 10 gb — I'm talking
# about current day").
#
# Was 35. The spot rings are VecDeque::with_capacity(bars_per_day x spot_days),
# allocated EAGERLY when a slot is first created — so capacity is memory the
# process commits the moment an instrument is seen, not memory it grows into.
# At the store's own MAX_SPOT_BAR_SLOTS ceiling (25,000) that made 35 days
# 34.9 GB: the single largest RAM commitment in the process, larger than
# QuestDB's own 12g cap, and the ONE thing that broke the 10 GB budget.
# Nothing else came close - the aggregator is 155 MB, indicators 18 MB, and
# raw ticks cost ZERO (folded then dropped; RAM is O(instruments), not
# O(ticks), so tick rate does not enter this budget at all).
#
# Nothing reads the depth. A full call-site sweep found the ONLY production
# reader of this store is the 60s gauge task that reports how deep the store
# is - self-referential. Indicator warmup takes a &[Candle] slice and has zero
# production callers; the 15:31 cross-verify reads QuestDB over /exec; the
# prev-day pct columns are carried on the seal itself; the chain store is
# sized independently by chain_row_cap. So 35 days bought retention for a
# consumer that does not exist, at 34 GB.
#
# Cost of this change: depth_days() reports 1, and if [rest_candle_fold] is
# ever re-enabled with catchup_days = 35 the install emits its existing
# "spot_days is SHALLOWER than the fold catch-up window" warn and evicts the
# older fetched days. Raising it back is a one-line config change with no
# schema impact - but do the arithmetic first: at 25,000 slots each day costs
# ~1 GB, so the 10 GB budget is spot_days <= 9.
spot_days = 1
chain_row_cap = 1000

