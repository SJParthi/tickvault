[partition_retention]
# STANDARD class (audit / daily-data tables) hot window.
retention_days = 90
# HIGH-VOLUME market-data class (ticks + 21 candles_* tables + the per-minute
# chain tables option_chain_1m/option_contract_1m_rest since 2026-07-16).
# 35d hot on EBS (2026-07-16 operator directive — "our entire one month
# should be stored and fetched from questdb even before premarket"; was 14),
# with the verified S3 archive as the durable long-term store (SEBI retention
# is satisfied by the S3 copy — aws-budget hot-window doctrine). The chain
# tables moved here from the 90d Standard class the same day (the operator's
# "option only for the current day" direction — 35d is the smallest clean
# change; a tighter chain-only knob is a follow-up if disk pressure demands).
# TRIMMED 35 -> 15 on 2026-08-19 by OPERATOR APPROVAL, verbatim:
#   "yes bro i believ its betetr to have 15 dyas as yous aid dud eokay?
#    do get there: trim minute history 35->15 days, okay?"
#
# This is precisely the change the FLAGGED note further down this file said
# was "an operator scope call, not an executor one". It has now been made by
# the operator, so the flag is resolved rather than carried forward.
#
# What this window still covers, after the 2026-08-19 Intraday split: ONLY
# the eight minute-and-above candle tables (1m, 2m, 3m, 5m, 15m, 30m, 60m,
# 1d). Ticks and the sixteen sub-minute tables left this class entirely and
# are current-day. So this number is now a judgement about how much warmup
# history indicators and strategies need — not about disk pressure.
#
# Measured saving (2026-08-18 live basis, all eight tables ~0.3 GB/day at the
# ~4,565-SID universe): ~6 GB today, ~33 GB at the 25,000-instrument target.
#
# NOT a retention cut: every partition is exported, uploaded and row-count-
# VERIFIED in S3 before it leaves EBS. Fifteen days is the LOCAL window; the
# full history stays in S3 and is queryable from there.
market_data_hot_days = 15
# DEPTH hot window (2026-08-15) — its own knob because market_depth is an
# order of magnitude heavier than anything else on the box.
#
# Measured, not guessed: 4 SYMBOL keys (4 B each) + 7 eight-byte columns =
# 72 B/row; depth-20 emits 40 rows/update across 250 instruments and
# depth-200 emits 400 across 5; the sockets are up for the 24,000-second
# persistence window (09:00-15:40 IST), NOT a 24-hour day. That is
# ~21 GB/DAY at one snapshot per second per instrument, ~104 GB/day at five.
#
# At market_data_hot_days = 35 that would commit 735 GB MINIMUM on a 100 GB
# root: the sweep would never fire before the disk filled, and a full disk
# stops every table, not just this one.
#
# 3 = today + yesterday + one day of slack for a sweep skipped because the
# box was down. Clamped to the same MIN_HOT_DAYS = 2 floor as every other
# class, so today and yesterday are untouchable even at 0.
#
# This is NOT a retention cut. Every partition is exported, uploaded and
# row-count-VERIFIED in S3 before it leaves EBS — the data is kept in full,
# only the hot window on local disk is short. The update rate is Assumed
# until the first live session; if it lands at the high end, lower this to
# 2 rather than growing the volume.
# MEASURED 2026-08-18 (the first live session with depth actually flowing) —
# lowered 3 -> 2 per this block's own standing instruction below.
#
# QuestDB on the box: market_depth = 9.2 GB after 104 minutes of capture
# (first depth row 03:46:36Z, sampled 05:30Z) = 5.3 GB/HOUR. Across the
# 6h40m persistence window that is ~35 GB/DAY — above the ~21 GB/day
# one-snapshot-per-second estimate this block was written against, i.e. the
# "high end" case it names. Live shape: d20 = 84 instruments x 20 levels,
# d200 = 5 instruments x 200 levels, 133 M rows in those 104 minutes.
#
# At 3 days that commits ~106 GB of depth alone on a 100 GB root — the sweep
# could not fire before the disk filled, and a full disk stops every table.
# At 2 it is ~71 GB, which fits alongside the rest with the archive running.
#
# Still not a retention cut: every partition is exported, uploaded and
# row-count-VERIFIED in S3 before it leaves EBS. 2 is also the MIN_HOT_DAYS
# floor, so today and yesterday stay local and untouchable.
#
# FLAGGED, not fixed here: market_data_hot_days = 35 above is a 2026-07-16
# OPERATOR DIRECTIVE, and ticks alone are now running ~2.5 GB/day, so that
# window implies ~87 GB on its own. Changing it is an operator scope call,
# not an executor one — but the arithmetic no longer fits beside depth, and
# the honest options are a shorter market-data window or the 100 -> 200 GB
# volume grow that variables.tf already permits.
#
# RESOLVED 2026-08-19, on BOTH halves, and it is worth recording which half
# fixed what because they are different problems:
#
#   (a) The "~87 GB of ticks" half was never a market-data-window problem at
#       all. Ticks LEFT this class that day — the Intraday split made them
#       current-day — so the window no longer implies any tick storage.
#   (b) The remaining half (minute history) was trimmed 35 -> 15 by operator
#       approval, quoted at the setting above.
#
# STILL OPEN and NOT resolved by either: the 100 -> 200 GB volume grow. It
# was AUTHORIZED on 2026-08-19 (Quote 16) and VERIFIED UNAPPLIED the same day
# by `aws ec2 describe-volumes` on vol-0c6ab6e593e39d8c8 — the live root is
# 100 GB / 3000 IOPS / 125 MiB/s, not the 200 GB / 6000 / 500 the rule files
# record. At today's ~4,565-SID shape everything fits with room; at the
# 25,000-instrument target depth ALONE is ~114 GB/day and no window trim can
# make that fit 100 GB. The grow is an out-of-band online command
# (`aws ec2 modify-volume`), never `terraform apply`.
depth_hot_days = 1
# INTRADAY hot window (2026-08-19) — `ticks` + the SIXTEEN sub-minute candle
# tables (candles_1s..15s, 30s). Its own knob on an operator directive that
# separates two things the single market-data window used to conflate:
#
#   "for depth or whatever it is only current day, worst case busy day ...
#    when it comes to historical we will just have minute levels, because
#    indicators, strategies and minute level of all these historical"
#
# Why they cannot share `market_data_hot_days = 35`, in numbers: at the
# 25,000-instrument target `ticks` runs ~14 GB/day (scaled from the measured
# ~2.5 GB/day at ~4,565 SIDs), so 35 days is ~480 GB on a 200 GB root. The
# sixteen sub-minute tables are heavier still. Either alone overflows the
# volume, and a full disk stops EVERY table — the same reasoning that gave
# market_depth its own knob on 2026-08-15, applied one level down.
#
# Minute-and-above candles are deliberately NOT in this class. They are the
# history the indicator and strategy paths read, they are two orders of
# magnitude smaller per day (candles_1m at 25,000 instruments is ~0.9 GB/day),
# and they keep the 35-day window unchanged.
#
# 1 = current day only, and it is HONOURED (not clamped up). CORRECTED
# 2026-08-19: this block previously said "2 = the MIN_HOT_DAYS floor ...
# Setting 0 or 1 changes nothing - effective_hot_days clamps to the same
# floor." That was written before the per-class floor existed and became
# FALSE the moment MIN_HOT_DAYS_MARKET_DATA (1) was introduced hours later:
# 1 is now honoured exactly, so the setting DOES change behaviour and a
# reader trusting the old text would believe yesterday is retained when it
# is not. Only 0 is clamped (up to 1) — at 0 the cutoff becomes now() and
# the partition being written this second becomes eligible.
#
# NOT a retention cut: every partition is exported, uploaded and
# row-count-VERIFIED in S3 before it leaves EBS.
intraday_hot_days = 1
# Archive->verify->drop leg ON (2026-07-13 disk-pressure remediation).
# Fail-closed: a partition is dropped ONLY after its S3 copy is row-count-
# and size-verified. ROLLBACK: set false (or delete the key) to restore the
# legacy detach-only behaviour instantly.
archive_enabled = true
# Empty = derive tv-<TV_ENVIRONMENT>-cold (prod -> tv-prod-cold; the instance
# role already has Put/Get/List on it — no IAM change).
archive_bucket = ""
# Oldest-first per-run bound so the first catch-up sweep converges over a few
# post-market runs instead of overrunning the 16:30 IST box stop.
max_partitions_per_run = 200

# --- PRESSURE-triggered archival (feed-hardening Item 5, 2026-08-19) ---
#
# The knobs above trigger archival on partition AGE, once, after market
# close. At the authorized scale the volume fills INSIDE a session, hours
# before anything is age-eligible — so the age-triggered leg can never fire
# in time, and a full volume stops every writer (ticks, candles, depth,
# audit) rather than merely letting old data linger.
#
# This block adds a TRIGGER, never a delete path. When it fires it calls the
# SAME archive -> upload -> verify (row count + object size + SHA-256) ->
# audit -> drop flow as the daily leg. A partition that cannot be verified
# into S3 is KEPT. When nothing reclaimable remains, it fires
# STORAGE-GAP-05 (Critical) and STOPS — it never deletes unarchived data to
# save itself.
pressure_archive_enabled = true

# Used-percentage at or above which an episode starts. 75 leaves a quarter
# of the volume as working room: the export streams a gzip temp file before
# anything is dropped, so a threshold too close to full would leave the
# remediation itself unable to run.
pressure_high_water_pct = 75

# Used-percentage strictly below which the episode ends. The 15-point gap is
# the anti-thrash band — an episode that ended at 74 would restart on the
# next poll. An inverted pair DISABLES the loop loudly rather than
# oscillating.
pressure_low_water_pct = 60

# Hot window used only while under pressure. Clamped UP to the same hard
# MIN_HOT_DAYS = 2 floor as every other class, so today's and yesterday's
# partitions are untouchable AT ANY PRESSURE: the archiver's verify
# re-counts rows after the export (closing the export->count race) but not
# the count->drop race, and on a partition still being written that window
# can swallow an arriving tick. Setting this lower changes nothing.
pressure_hot_days = 2

# Cooldown between episodes. Bounds mid-session export load when usage sits
# near the high-water mark for a long stretch.
pressure_min_interval_secs = 900

# Archive passes per episode before escalating. Each pass archives up to
# max_partitions_per_run partitions; if four have not moved the needle the
# volume is not recoverable by retention and the operator needs to hear so.
pressure_max_passes = 4

