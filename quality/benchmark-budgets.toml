# =============================================================================
# tickvault — Benchmark Latency Budgets
# =============================================================================
# Used by: scripts/bench-gate.sh (CI Stage 5)
# Source: docs/standards/quality-gates.md Gate 5a
#
# Each entry: benchmark_name = max_ns (nanoseconds)
# >5% regression from previous baseline = FAIL
# Exceeding absolute budget = FAIL
# =============================================================================

# Maximum allowed regression percentage from baseline
max_regression_pct = 5.0

# A relative regression whose confident size (median x CI lower bound / (1 + lb))
# is under this many ns is reported as NOISE, not a regression (2026-10-11:
# 3-7ns benches failed on 0.3-0.5ns of runner noise). Absolute budgets still gate.
min_regression_delta_ns = 1.0

[budgets]
# Core crate — hot path
# Key must be a substring of (or contain) the criterion bench_function name
# as lowercased with / replaced by _. See scripts/bench-gate.sh for matching logic.
dispatch_frame           = 10           # <10ns  — matches dispatch_frame/ticker, dispatch_frame/quote
pipeline                 = 100          # <100ns per tick — matches pipeline/batch_100_mixed, pipeline/burst_100_ticker
# 2026-08-08: comment corrected — this guards a plain `std::HashMap` keyed on the
# I-P1-11 composite `(security_id, exchange_segment)`, NOT `papaya`. `papaya` is a
# real workspace dep but is used only in crates/trading (in_mem/day_ohlc_tracker.rs);
# it was never used by InstrumentRegistry. Budget value UNCHANGED at 50ns, and the
# Criterion IDs are unchanged — only the methods measured moved to the segment-aware
# accessors after the id-only ones were deleted.
registry_get             = 50           # <50ns  — matches registry/get_hit, registry/get_miss (HashMap O(1) composite lookup)
token_handle             = 50           # <50ns  — matches token_handle/load (arc-swap hot-path read)
# f32_to_f64_clean budget removed in the stage-2 dead-WS sweep (2026-07-17):
