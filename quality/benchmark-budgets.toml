# Trading crate — OBI (Order Book Imbalance)
obi_compute              = 1000         # <1μs = 1000ns — matches obi_compute_20_levels, obi_compute_with_wall (measured: ~297ns)

# App crate — order-runtime dry-run PR (2026-07-14): the mark-forward gate
# into the dry-run order runtime. 2026-07-17 truth-sync: the mark SOURCE is
# the Groww per-minute REST legs' persist-confirm points (re-homed
# 2026-07-16 — the live-bridge per-tick source died with #1581); the gate
# KEEPS its hot-path-grade budget so a future higher-rate source needs no
# re-budget.
# Substring-matches order_gate/mark_forward_{disarmed,armed_full,armed_accept}.
# Disarmed (the dominant path) is a single Relaxed load (~1ns); the armed
# arms are one bounded try_send of a 16-byte Copy struct (drop arm counts a
# static-key counter). 100ns covers all three with CI-runner headroom.
# Companion zero-alloc evidence: crates/app/tests/dhat_mark_forward.rs.
order_gate_mark_forward  = 100          # <100ns — hot-path-grade mark gate

# Live-lane frame drains (audit PROOF-9, 2026-10-11). crates/app/benches/feed_drain.rs.
# Before this, nothing measured either drain, though both run once per frame on
# the frame-drain task. Per-ELEMENT budgets ([elements] below divides the frame
# median): per TICK for the main feed, per LEVEL for depth (depth is O(levels)
# by nature, never O(1)). Measured 2026-10-11, release, 4-core x86 dev
# container, nothing else running: main feed 4.96 us per 4-quote frame
# (~1,240 ns/tick: decode, lag record, 10-timeframe fold, one ILP row);
# depth-20 53.8 us per 80-level frame (~672 ns/level); depth-200 137.5 us per
# 200-level packet (~687 ns/level). Per level the cost is the ILP row
# serialisation (one row per level), which is why depth is the dominant drain
# cost at ~24x the tick volume. Budgets are ~2x the measured figure; CI
# multiplies them again for shared runners. NOT measured on the prod host.
# Companion zero-alloc evidence: dhat_live_ingest_seam.rs, dhat_depth_drain.rs.
# 2026-10-29 (plan ITEM DT step 0, owner "go ahead with your recommendation",
# sub-microsecond per-tick target): 2500 -> 1000. The CI median on 7cacc0e83
# was 768.7 ns per tick and the CI p99 922 ns per tick (job 123319329443,
# x86 GitHub runner), so the median under 1 us is now a gate instead of a
# claim on dev hardware (multiplier 1.0). On CI the absolute arm is
# multiplied by BENCH_BUDGET_MULTIPLIER (2.5), so the CI ceiling is 2.5 us
# per tick for the median AND for the feed_drain p99 tail gate (was 6.25 us);
# the 5% regression arm is what holds the CI median near 769 ns. The same key
# also gates feed_drain/main_feed_frame_4_full (Full packets, every price
# field set, inline depth book rows), added the same day.
feed_drain_main_feed     = 1000         # <1us per tick — matches feed_drain/main_feed_frame_4_quotes and feed_drain/main_feed_frame_4_full
feed_drain_depth         = 1500         # <1.5us per level — matches feed_drain/depth20_frame_4x20 and feed_drain/depth200_packet
candles_consume_tick     = 1000         # <1us per tick — the per-tick candle fold over every timeframe (plan ITEM DT, 2026-10-30). Matches candles/consume_tick_hit_20k, candles/consume_tick_hit_500 (500-tick batches, divided below) and candles/consume_tick_live_mix_2k (one tick per element); the bench also holds the live-mix p99 to this key. Measured on the x86 dev container: see the PR that added it (plan ITEM DT-FOLD) for the hit and live-mix figures.
tick_row_append          = 1000         # <1us per row — matches tick_row_append/full_row, tick_row_append/quote_row and tick_row_append/tick_quotes_row (plan ITEM DT row stage, 2026-10-30). Measured on the x86 dev container 0.84-1.06 us per row; about 90% of it is the questdb-rs buffer encoding (float text, name escaping), which its public API cannot bypass. 2026-10-30 (DT-OWN-ILP): also matches tick_row_append/own_{full,quote,tick_quotes}_row (our own encoder, `[tick_storage] own_ilp_encoder`), and the bench holds those three to this key at p99 per row. Measured 2026-10-30 on the x86 dev container (busier than the row-stage run: main's own rows read 1.17-1.36 us there): ours 0.65-0.77 us per row median, per-call p50 0.57-0.66 us, p99 0.86-1.19 us across three runs.

# Common crate
is_trading_day           = 50           # <50ns  — matches calendar/is_trading_day
config_toml_load         = 10000000     # <10ms = 10,000,000ns — matches config/toml_load

# Per-tick side stores (plan ITEM DT, 2026-10-30)
tick_gap_detector        = 400          # <400ns per call (measured 2026-10-30, x86 dev container: median 42 ns hit, p99 198 ns with the clock pair) — matches tick_gap_detector/observe_hit, observe_refused_full, observe_tracked_hit, observe_tracked_miss (full at 25,000). The same value is the per-call p99 ceiling in the bench (plan ITEM DT, side stores, 2026-10-30)
spot_price_store         = 250          # <250ns per call (measured: median 27 ns, p99 157 ns with the clock pair) — matches spot_price_store/record_* (full at 25,000) and its p99 gate (plan ITEM DT, 2026-10-30)
backup_dedup             = 400          # <400ns per packet (measured: median 55 ns accept, p99 153 ns with the clock pair) — matches backup_dedup/admit_* (set full at 5,000) and its p99 gate (plan ITEM DT, 2026-10-30)
tick_conservation_ledger = 100          # <100ns per row (measured: median 8 ns, p99 58 ns with the clock pair) — matches tick_conservation_ledger/note_row_appended_* and its p99 gate (plan ITEM DT, 2026-10-30)

# =============================================================================
# Per-element counts for BATCH benchmarks (2026-06-02)
# =============================================================================
# Some benchmarks process N elements per Criterion iteration, so their measured
# median is the BATCH time, not the per-element time. The budgets above are
# PER-ELEMENT (e.g. `pipeline` is "<100ns per tick"). bench-gate.sh divides a
# batch bench's median by its element count here before comparing, so the gate
# enforces the per-element budget honestly. Benches not listed default to 1.
#
# Found by the 2026-06-02 load+chaos proof run: before this, the gate compared
# pipeline/batch_100_mixed's 100-tick median (~470ns) against the 100ns/tick
# budget — a unit bug that failed by construction even though per-tick latency
# was ~4.7ns (≈20× under budget).
[elements]
pipeline_batch_100_mixed  = 100   # 100 mixed packets per iter
pipeline_burst_100_ticker = 100   # 100 ticker packets per iter
feed_drain_main_feed_frame_4_quotes = 4    # 4 Quote packets per frame (audit PROOF-9)
feed_drain_main_feed_frame_4_full   = 4    # 4 Full packets per frame (ITEM DT step 0, 2026-10-29)
feed_drain_depth20_frame_4x20       = 80   # 4 packets x 20 levels per frame
feed_drain_depth200_packet          = 200  # 200 levels per packet
backup_dedup_admit_tick_pair        = 2    # two packets per iter: the first copy and its byte-identical second copy (plan ITEM DT, 2026-10-30)
candles_consume_tick_hit            = 500  # 500 ticks per hit batch (candle_fold TICKS_PER_BATCH)
tick_row_append                     = 1000 # 1,000 rows per iteration (one fresh writer per 5 iterations, outside the timed region)
