[package]
name = "tickvault-common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rkyv = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# tokio (workspace-pinned): used ONLY for the `broker_order_events::push_active`
# watch channel — the Session-3 order-update PUSH-active seam that lives in
# `common` so a future core/app producer + a trading consumer share it without
# either depending on `tickvault-trading` (Groww orders PR-A0, 2026-07-15).
tokio = { workspace = true }

# CVE pins (2026-04-22, Parthiban-authorised). Unused direct deps that
# exist solely to force `cargo`'s lockfile resolver to pick patched
# versions of TLS/crypto transitives flagged by dependabot. We use this
# mechanism because:
#   - `cargo update` is project-banned (.claude pre-tool hook).
#   - `[patch.crates-io]` cannot redirect a crate to a different version
#     within the same source.
# The cargo-machete ignored list below silences the unused-dep warning.
# Reviewer note: deletion of these lines reverts the lockfile to vulnerable
# versions on the next `cargo build`, so DO NOT remove without re-issuing
# the upgrade through whatever new mechanism replaces this.
#
# Patched CVEs:
#   aws-lc-sys 0.38.0 → 0.40.0: AWS-LC X.509 Name Constraints Bypass (HIGH)
#                              + CRL Distribution Point Scope Check (HIGH)
#   rustls-webpki 0.103.9 → 0.103.13: CRLs-not-authoritative (Moderate)
#                                   + Name-constraints-wildcard (Low)
#                                   + URI-name-constraints (Low)
#   rand 0.9.2 → 0.9.4: rand::rng() unsound with custom logger (Low)
# Note: rand 0.8.5 also remains in the lockfile (transitive via getrandom
# v0.2 path) but the CVE applies to the 0.9.x rand::rng() API only.
# rustls-webpki 0.101.7 also remains, pulled in by tokio-rustls 0.24.1
# which is a deep AWS SDK transitive (aws-smithy-http-client 1.1.12).
# Bumping the AWS SDK suite is a major change deferred to its own PR.
# Each of the four below is a caret FLOOR, not a pin, and that is correct
# here: the job is "at least the patched version". An `=` would freeze the
# tree at today's fix and refuse the NEXT one, which is the opposite of what
# a CVE remediation wants. The workspace-wide `=`-pin rule therefore does not
# apply to them, and the marker below says so in a form the gate can read
# rather than leaving a human to remember the distinction.
#
# Honest note (measured 2026-08-18): `aws-lc-rs` is ALSO declared in the root
# manifest at `=1.18.0`, and Cargo.lock resolves 1.18.0. The floor here reads
# 1.17.0, so it is satisfied and inert -- it constrains nothing today. Left at
# the CVE-fix version deliberately: raising it to match the workspace pin
# would couple a security floor to an unrelated upgrade decision.
# SECURITY-FLOOR: AWS-LC X.509 Name Constraints Bypass + CRL scope check (HIGH)
aws-lc-sys = "0.44.0"
# SECURITY-FLOOR: transitive of aws-lc-sys; floor tracks the same advisories
aws-lc-rs = "1.17.0"
# SECURITY-FLOOR: CRLs-not-authoritative (Moderate) + name-constraints (Low x2)
rustls-webpki = "0.103.13"
# SECURITY-FLOOR: rand::rng() unsound with a custom logger (Low)
rand = "0.10.1"

[features]
# Gate 2 of the Groww order-side live-fire lattice (groww-second-feed-scope
# §39.2). NON-DEFAULT — the broker_order_events seam is always compiled, but
# this feature marks the order-side build surface so the lattice guard can
# assert it exists in BOTH manifests and is never in a `default = [...]` set.

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "calendar"
harness = false

[[bench]]
name = "config"
harness = false

[package.metadata.cargo-machete]
ignored = ["chrono-tz", "figment", "secrecy", "toml", "tracing", "uuid", "aws-lc-sys", "aws-lc-rs", "rustls-webpki", "rand"]
