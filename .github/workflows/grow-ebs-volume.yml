# grow-ebs-volume.yml — guarded online growth of the prod root EBS volume.
#
# Authorization: operator Quote 16, 2026-08-19 ("Grow gp3 100 -> 200 GB yes
# even icnrease this also dude okay?"), recorded in
# .claude/rules/project/daily-universe-scope-expansion-2026-05-27.md §0/§7
# Rule 3, and reaffirmed the same evening ("I need the full plan with 200gb
# ... for tomorrow run itself").
#
# WHY THIS WORKFLOW EXISTS AT ALL
# ------------------------------------------------------------------------
# The grow was authorized on 2026-08-19 and did NOT happen, because the only
# identity available to the automation agent cannot perform it:
#
#   UnauthorizedOperation: user/claude-code-agent is not authorized to
#   perform: ec2:ModifyVolume ... no identity-based policy allows it
#
# `secrets.AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` are, per
# downsize-instance.yml's own header, "the only stored creds with EC2
# mutation grants". So the capability exists in CI and nowhere else, which is
# why this is a workflow rather than a script someone runs by hand — the
# operator's standing rule is zero manual intervention.
#
# WHY GROWING IS SAFE, AND WHY IT IS STILL ONE-WAY
# ------------------------------------------------------------------------
# gp3 grows ONLINE with no stop and no detach. It can NEVER shrink: a smaller
# modify-volume is refused, and a 200 GB snapshot cannot restore into
# anything smaller, so reversing needs a terminate-and-recreate. That is why
# every guard below fails CLOSED and why the target is an explicit input
# rather than a default anyone can trip over.
#
# THE FILESYSTEM HALF (the part a volume grow alone does NOT do)
# ------------------------------------------------------------------------
# A 200 GB volume with a 100 GB filesystem gains exactly nothing. The host is
# Amazon Linux 2023 (variables.tf `ami_id`), whose cloud-init runs the
# `growpart` + `resizefs` modules on EVERY boot — so the filesystem follows
# the volume at the next 08:30 IST start with no action from us.
#
# That is a claim about someone else's default, so this workflow does NOT
# rely on it silently: step 5 runs growpart + resize2fs over SSM when the
# instance is RUNNING, and step 6 reports the honest post-state. When the box
# is stopped (the normal dispatch window) it says so plainly and defers to
# cloud-init, and the next run's verification is what proves it.
#
# SECURITY: workflow_dispatch inputs are NEVER template-interpolated into
# run: scripts — every input flows through a step env: block (the GitHub
# script-injection class; ${{ }} is text substitution before bash runs).

name: grow-ebs-volume

on:
  workflow_dispatch:
    inputs:
      confirm_volume_id:
        description: 'Type the EXACT root volume id to confirm (aws ec2 describe-instances --filters Name=tag:Name,Values=tv-prod-app --query "Reservations[].Instances[].BlockDeviceMappings[0].Ebs.VolumeId").'
        required: true
      target_size_gb:
        description: 'New size in GB. Must be >= the current size (gp3 cannot shrink) and <= 600 (the variables.tf ebs_gp3_size_gb ceiling, raised 500 -> 600 by operator Quote 22, 2026-09-05, after 300 -> 500 by Quote 20, 2026-09-02).'
        required: true
        default: '600'
      target_iops:
        description: 'Provisioned IOPS, 3000-16000 (the variables.tf ebs_gp3_iops range). Default 6000 = operator Quote 17, 2026-08-19. Unlike size this CAN go down.'
        required: true
        default: '6000'
      target_throughput:
        description: 'Throughput in MiB/s, 125-1000 (the variables.tf ebs_gp3_throughput range). Default 500 = operator Quote 17, 2026-08-19. Unlike size this CAN go down.'
        required: true
        default: '500'

concurrency:
  group: grow-ebs-volume-prod
  cancel-in-progress: false # never interrupt an in-flight modify-volume

permissions:
  contents: read

jobs:
  grow:
    name: Grow root EBS volume (online, guarded)
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Check the mutation credentials exist at all
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SECRET" != "true" ]; then
            echo "::error::AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are not set."
            echo "These are the only stored credentials with EC2 mutation"
            echo "grants (see downsize-instance.yml). Without them this"
            echo "workflow cannot grow the volume — failing before any AWS"
            echo "call rather than half-way through."
            exit 1
          fi
          echo "mutation credentials present"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4 tag commit, 2026-07-15
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Probe IAM BEFORE any mutation
        env:
          VOL_ID: ${{ inputs.confirm_volume_id }}
        run: |
          set -euo pipefail
          echo "identity:"
          aws sts get-caller-identity --output text
          # A real READ probe, then a --dry-run of the exact mutation. A
          # missing grant is discovered here, not half-way through.
          aws ec2 describe-volumes --volume-ids "$VOL_ID" --output text >/dev/null
          set +e
          OUT=$(aws ec2 modify-volume --volume-id "$VOL_ID" --size 200 --dry-run 2>&1)
          set -e
          if echo "$OUT" | grep -q "DryRunOperation"; then
            echo "ec2:ModifyVolume GRANTED (dry-run succeeded)"
          else
            echo "::error::ec2:ModifyVolume is NOT granted to these credentials."
            echo "$OUT"
            exit 1
          fi

      - name: Verify every target and decide what actually changes
        id: guard
        env:
          VOL_ID: ${{ inputs.confirm_volume_id }}
          TARGET: ${{ inputs.target_size_gb }}
          WANT_IOPS: ${{ inputs.target_iops }}
          WANT_TP: ${{ inputs.target_throughput }}
        run: |
          set -euo pipefail
          # ---------------------------------------------------------------
          # Three dimensions, and they do NOT share a rule.
          #
          #   size       — grows ONLY. gp3 refuses a smaller value and a
          #                larger snapshot cannot restore into a smaller
          #                volume, so a shrink is unrecoverable, not merely
          #                wrong.
          #   iops       — moves in BOTH directions, freely.
          #   throughput — moves in BOTH directions, freely.
          #
          # Until 2026-08-20 this step knew only about size, and returned
          # early the moment size matched. That is how the operator's Quote 17
          # performance raise (IOPS 3000 -> 6000, throughput 125 -> 500,
          # authorized and PAID FOR on 2026-08-19) never reached the live
          # volume: the size half had already landed at 200 GB, so every
          # dispatch reported "nothing to do" and stopped looking. The volume
          # sat at the right SIZE and the wrong SPEED for a day, and the
          # throughput half is the one the operator's own authorization calls
          # load-bearing.
          # ---------------------------------------------------------------
          for v in TARGET WANT_IOPS WANT_TP; do
            eval "val=\$$v"
            case "$val" in ''|*[!0-9]*)
              echo "::error::$v must be a positive integer (got '$val')."; exit 1;;
            esac
          done

          # The instance this volume must belong to. Typing the id of some
          # OTHER account volume should not silently modify it.
          EXPECTED=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=tv-prod-app \
            --query 'Reservations[].Instances[].BlockDeviceMappings[0].Ebs.VolumeId' \
            --output text)
          if [ "$VOL_ID" != "$EXPECTED" ]; then
            echo "::error::$VOL_ID is not the tv-prod-app root volume (that is $EXPECTED)."
            exit 1
          fi

          read -r CUR CUR_IOPS CUR_TP <<EOF
          $(aws ec2 describe-volumes --volume-ids "$VOL_ID" \
              --query 'Volumes[0].[Size,Iops,Throughput]' --output text)
          EOF
          echo "current: size=${CUR} GB iops=${CUR_IOPS} throughput=${CUR_TP} MiB/s"
          echo "target : size=${TARGET} GB iops=${WANT_IOPS} throughput=${WANT_TP} MiB/s"

          # --- size: grow-only, ceiling-bounded ---
          if [ "$TARGET" -lt "$CUR" ]; then
            echo "::error::gp3 can NEVER shrink. ${TARGET} < ${CUR} — refusing."
            exit 1
          fi
          if [ "$TARGET" -gt 600 ]; then
            echo "::error::${TARGET} exceeds the variables.tf ebs_gp3_size_gb ceiling of 600."
            echo "Raising it needs a validation edit AND its own dated operator quote."
            exit 1
          fi

          # --- iops / throughput: range-bounded, either direction ---
          if [ "$WANT_IOPS" -lt 3000 ] || [ "$WANT_IOPS" -gt 16000 ]; then
            echo "::error::target_iops must be 3000-16000 (the variables.tf ebs_gp3_iops range)."
            exit 1
          fi
          if [ "$WANT_TP" -lt 125 ] || [ "$WANT_TP" -gt 1000 ]; then
            echo "::error::target_throughput must be 125-1000 (the variables.tf ebs_gp3_throughput range)."
            exit 1
          fi

          # --- what actually changes ---
          # `if` blocks, never `[ test ] && VAR=true`. Under `set -e` an
          # AND-list whose left side is FALSE returns non-zero and kills the
          # step — and here "false" is the ordinary case (a dimension that
          # already matches). The terse form would have failed the run
          # precisely when there was nothing wrong.
          SIZE_CHANGE=false
          PERF_CHANGE=false
          if [ "$TARGET" -ne "$CUR" ]; then SIZE_CHANGE=true; fi
          if [ "$WANT_IOPS" -ne "$CUR_IOPS" ]; then PERF_CHANGE=true; fi
          if [ "$WANT_TP" -ne "$CUR_TP" ]; then PERF_CHANGE=true; fi

          {
            echo "size_change=${SIZE_CHANGE}"
            echo "perf_change=${PERF_CHANGE}"
            echo "current=${CUR}"
          } >> "$GITHUB_OUTPUT"

          if [ "$SIZE_CHANGE" = false ] && [ "$PERF_CHANGE" = false ]; then
            echo "::notice::size, IOPS and throughput already match — nothing to do."
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the modification (size + performance in ONE call)
        if: steps.guard.outputs.noop == 'false'
        env:
          VOL_ID: ${{ inputs.confirm_volume_id }}
          TARGET: ${{ inputs.target_size_gb }}
          WANT_IOPS: ${{ inputs.target_iops }}
          WANT_TP: ${{ inputs.target_throughput }}
        run: |
          set -euo pipefail
          # ONE call, never two, and that is a correctness requirement rather
          # than tidiness: AWS enforces a cooldown (~6 hours) between
          # modifications of the same volume. Two sequential calls would land
          # the first and have the second refused, leaving the volume half
          # changed — and the half that would lose is whichever ran second.
          # Passing every dimension together makes a partial apply impossible.
          #
          # Unchanged dimensions are passed anyway. AWS treats a value equal
          # to the current one as a no-op, and sending all three keeps the
          # request a faithful statement of the intended end state instead of
          # a diff that has to be reconstructed to be understood.
          aws ec2 modify-volume --volume-id "$VOL_ID" \
            --size "$TARGET" --iops "$WANT_IOPS" --throughput "$WANT_TP" \
            --query 'VolumeModification.[ModificationState,TargetSize,TargetIops,TargetThroughput]' \
            --output text
          # Poll until AWS reports the modification optimizing or complete.
          # "optimizing" already means the new size is USABLE — waiting for
          # "completed" can take hours and is not required.
          for i in $(seq 1 60); do
            STATE=$(aws ec2 describe-volumes-modifications --volume-ids "$VOL_ID" \
                     --query 'VolumesModifications[0].ModificationState' --output text)
            echo "poll $i: $STATE"
            case "$STATE" in
              optimizing|completed) break;;
              failed) echo "::error::modification FAILED"; exit 1;;
            esac
            sleep 10
          done
          # Verify ALL THREE. Asserting only the size is how a performance
          # change could report success while silently not landing — the same
          # blind spot, one layer down, that lost the Quote 17 raise.
          read -r SIZE IOPS TP <<EOF
          $(aws ec2 describe-volumes --volume-ids "$VOL_ID" \
              --query 'Volumes[0].[Size,Iops,Throughput]' --output text)
          EOF
          echo "volume is now size=${SIZE} GB iops=${IOPS} throughput=${TP} MiB/s"
          # Same `set -e` reasoning as the guard: `if`, not `&&`. Every
          # assertion here PASSES on the happy path, so the terse form would
          # have exited the step on a completely successful modification.
          FAIL=0
          if [ "$SIZE" != "$TARGET" ]; then
            echo "::error::expected ${TARGET} GB, AWS reports ${SIZE} GB"; FAIL=1
          fi
          if [ "$IOPS" != "$WANT_IOPS" ]; then
            echo "::error::expected ${WANT_IOPS} IOPS, AWS reports ${IOPS}"; FAIL=1
          fi
          if [ "$TP" != "$WANT_TP" ]; then
            echo "::error::expected ${WANT_TP} MiB/s, AWS reports ${TP}"; FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi

      # Keyed on size_change, NOT on noop: a performance-only run changes no
      # block count, so there is no filesystem to grow and running the resize
      # would report a confusing no-change against a target it never moved.
      - name: Grow the filesystem (only possible while the box is running)
        if: steps.guard.outputs.size_change == 'true'
        env:
          TARGET: ${{ inputs.target_size_gb }}
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=tv-prod-app \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          STATE=$(aws ec2 describe-instances --instance-ids "$IID" \
            --query 'Reservations[].Instances[].State.Name' --output text)
          echo "instance $IID is $STATE"
          if [ "$STATE" != "running" ]; then
            echo "::notice::Box is ${STATE} — the filesystem cannot be grown now."
            echo "Amazon Linux 2023 runs cloud-init growpart + resizefs on EVERY"
            echo "boot, so the filesystem expands by itself at the next start."
            echo "That is someone else's default rather than our code, so it is"
            echo "stated as expected-not-proven: re-dispatch this workflow once"
            echo "the box is running and this step will verify and repair it."
            exit 0
          fi
          # The root device is DISCOVERED, not assumed. `/dev/nvme0n1` is
          # correct for today's single-EBS Nitro root, but NVMe enumeration is
          # not ordered — attach a second volume and the name can move. So the
          # remote script resolves the device backing `/` and acts on that.
          #
          # Every `|| true` is gone. The first version chained three of them
          # and never asserted the SSM Status, so a completely failed resize
          # exited GREEN — a 200 GB volume with a 100 GB filesystem reported as
          # done. That is the false-OK class this repo forbids, written into
          # the very step meant to prove the change landed.
          CMD=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript \
            --comment "grow root filesystem after EBS resize" \
            --parameters 'commands=["set -euo pipefail","ROOT=$(findmnt -no SOURCE /)","echo root-device=$ROOT","DISK=$(lsblk -no PKNAME \"$ROOT\")","PART=$(lsblk -no KNAME \"$ROOT\" | sed \"s/[^0-9]*//\")","growpart \"/dev/$DISK\" \"$PART\" || echo growpart-nochange","FSTYPE=$(findmnt -no FSTYPE /)","if [ \"$FSTYPE\" = xfs ]; then xfs_growfs -d /; else resize2fs \"$ROOT\"; fi","df -B1 --output=size / | tail -1"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            S=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                 --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|TimedOut) break;; esac
            sleep 5
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
            --query 'StandardOutputContent' --output text)
          echo "$OUT"
          # ASSERT the status. Without this the step passes on Failed.
          if [ "$S" != "Success" ]; then
            echo "::error::filesystem grow did not succeed (SSM status: $S)"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          # ASSERT the filesystem actually reached the target. A green SSM
          # status only says the commands ran, not that the disk grew.
          FS_BYTES=$(echo "$OUT" | tail -1 | tr -dc '0-9')
          WANT=$(( TARGET * 1000 * 1000 * 1000 * 90 / 100 ))  # 90% of nominal GB
          if [ -z "$FS_BYTES" ] || [ "$FS_BYTES" -lt "$WANT" ]; then
            echo "::error::filesystem is ${FS_BYTES:-unknown} bytes — below 90% of ${TARGET} GB."
            echo "The volume grew but the filesystem did not follow."
            exit 1
          fi
          echo "filesystem confirmed at ${FS_BYTES} bytes"

      - name: Report the honest final state
        if: always()
        env:
          VOL_ID: ${{ inputs.confirm_volume_id }}
        run: |
          set -euo pipefail
          aws ec2 describe-volumes --volume-ids "$VOL_ID" \
            --query 'Volumes[0].{Size:Size,IOPS:Iops,Throughput:Throughput,State:State}' \
            --output table || true
