# Nightly full-workspace test run — catches cross-crate regressions.
#
# Why this exists:
# The pre-push gate runs SCOPED tests (only the crates touched in the
# current diff). That's intentional — workspace-wide testing takes 10-15
# minutes per push, which is friction the scoped runner was built to
# eliminate. But the scoped runner misses a specific class of bug: a
# rename or signature change in crate A that silently breaks test code
# in crate B. Session 8 found 18 such bugs (stale TopMovers fields, SSM
# base path rename, hanging test fleet) — all of them invisible to the
# scoped runner and only caught by `cargo test --workspace`.
#
# This workflow runs the full workspace test suite once per night
# regardless of commit activity. If anything breaks cross-crate, we
# see it within 24 hours of the offending commit, not at the next
# release review.
#
# Scope:
#   - cargo fmt --check        (format drift)
#   - cargo check --workspace --tests --all-targets  (compile-time bugs)
#   - cargo test --workspace --no-fail-fast          (runtime bugs)
#
# Failure handling:
#   - Opens a GitHub issue tagged `nightly-regression` with the failing
#     test log. Manual triage from there — same flow as the dep-freshness
#     workflow.
#
# Runtime: ~12 minutes on a 2-core CI runner with a warm cache.
# Cost: marginal (GitHub Actions free tier covers 2,000 min/month).

name: full-test-nightly

on:
  schedule:
    # 19:30 UTC = 01:00 IST. One hour before dep-freshness-nightly so
    # the two jobs don't compete for the same runner. Runs every day.
    - cron: '30 19 * * *'
  workflow_dispatch:
    # Manual dispatch for operator-triggered runs.

concurrency:
  group: full-test-nightly
  cancel-in-progress: true

permissions:
  contents: read
  issues: write  # to open a regression issue on failure

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 2026-10-11: the 2026-10-10 run had 3.25 GB free when the storage
      # suite ran. The seal escalation spill refuses below its 4 GiB
      # free-disk floor by design, so its tests failed and a shared rescue
      # floor table left behind failed a tick_persistence test. The same
      # suite passes locally with disk (2,207 passed, 0 failed). Same recipe
      # as the ci.yml coverage job and the safety.yml jobs.
      - name: Free runner disk space (seal spill 4 GiB free-disk floor)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== df -h BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          echo "=== df -h AFTER cleanup ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # SHA-pinned (was @stable, supply-chain hardening 2026-04-25)
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: full-test-nightly

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check --workspace --tests --all-targets
        run: cargo check --workspace --tests --all-targets

      - name: cargo test --workspace --no-fail-fast
        id: test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test-output.log

      - name: Collect failure summary
        if: failure() && steps.test.conclusion == 'failure'
        id: summary
        run: |
          {
            echo "body<<EOF"
            echo "## Nightly full-workspace test regression"
            echo ""
            echo "**Commit:** ${GITHUB_SHA}"
            echo "**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "### Failing tests"
            echo ""
            echo '```'
            grep -E "^(failures:|test result:|FAILED|error\[)" /tmp/test-output.log | tail -80 || echo "(no failure markers found)"
            echo '```'
            echo ""
            echo "### Last 60 lines of output"
            echo ""
            echo '```'
            tail -60 /tmp/test-output.log
            echo '```'
            echo ""
            echo "This regression was caught by the nightly full-workspace"
            echo "test run. The scoped pre-push gate runs only on changed"
            echo "crates and misses cross-crate breakage (struct renames,"
            echo "constant changes, API signature changes) when the"
            echo "downstream test lives in an untouched crate."
            echo ""
            echo "Triage steps:"
            echo "1. Bisect the last 24h of commits to find the offending change."
            echo "2. Fix the test or the production code, not the workflow."
            echo "3. Close this issue with a reference to the fix commit."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Ported off actions/github-script to `gh` CLI (2026-08-11, rust-only
      # forever-lock): the inline JS was an interpreted-language runtime the
      # `rust_only_guard` invocation scan could not see. Behaviour is
      # unchanged. Security note: the old JS spliced the step output into a
      # JS TEMPLATE LITERAL (`const body = ` + backtick), so a backtick or
      # `${` in failing-test output could break or execute inside the script;
      # the body now travels via `env:` + `--body-file` and is never parsed.
      - name: Open regression issue on failure
        if: failure() && steps.test.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.summary.outputs.body }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ISSUE_BODY" > /tmp/nightly-issue-body.md
          # 2026-10-11: the labels did not exist, so the issue step failed
          # and no issue was ever opened. `--force` creates or updates them.
          gh label create nightly-regression --force --color B60205 \
            --description "Nightly full-workspace test failure"
          gh label create auto-triage --force --color FBCA04 \
            --description "Opened by a workflow for triage"
          gh issue create \
            --title "nightly regression: full-workspace test failed @ ${COMMIT_SHA:0:7}" \
            --body-file /tmp/nightly-issue-body.md \
            --label nightly-regression \
            --label auto-triage
