# Nightly full-workspace test run — catches cross-crate regressions.
#
# Why this exists:
# The pre-push gate runs SCOPED tests (only the crates touched in the
# current diff). That's intentional — workspace-wide testing takes 10-15
# minutes per push, which is friction the scoped runner was built to
# eliminate. But the scoped runner misses a specific class of bug: a
# rename or signature change in crate A that silently breaks test code
# in crate B. Session 8 found 18 such bugs (stale TopMovers fields, SSM
# base path rename, hanging test fleet) — all of them invisible to the
# scoped runner and only caught by `cargo test --workspace`.
#
# This workflow runs the full workspace test suite once per night
# regardless of commit activity. If anything breaks cross-crate, we
# see it within 24 hours of the offending commit, not at the next
# release review.
#
# Scope:
#   - cargo fmt --check        (format drift)
#   - cargo test --workspace --no-fail-fast          (compile + runtime bugs)
#   (2026-11-06: the separate `cargo check --workspace --tests --all-targets`
#   step was removed. `cargo test` already compiles the lib, bins, tests and
#   examples; the bench targets are compiled on every PR by ci.yml's
#   `cargo clippy --workspace --all-targets`. The extra check only added a
#   second artifact set to a disk that ran out.)
#
# Failure handling:
#   - Keeps ONE open GitHub issue titled "nightly regression: full-workspace
#     tests failing" (label `nightly-regression`): a failing night comments
#     on it, and only a night with no such issue open creates one. The body
#     leads with the lines that name the failure (FAILED, panicked, error[,
#     No space left), then the failed test-result lines, then the log tail.
#     (2026-11-06: it used to open a new issue every night, #2192 and #2193
#     being duplicates, and showed only the last 80 'test result' lines, so
#     the failing test's name never appeared.)
#
# Disk (2026-11-06): eight nights failed with "No space left on device" while
# linking the app's integration test binaries with full debug info (no test
# assertion failed). Both jobs now build without debug info, the same as the
# ci.yml coverage job, and print `df -h /` before and after the build.
#
# Runtime: ~12 minutes on a 2-core CI runner with a warm cache.
# Cost: marginal (GitHub Actions free tier covers 2,000 min/month).

name: full-test-nightly

on:
  schedule:
    # 19:30 UTC = 01:00 IST. One hour before dep-freshness-nightly so
    # the two jobs don't compete for the same runner. Runs every day.
    - cron: '30 19 * * *'
  workflow_dispatch:
    # Manual dispatch for operator-triggered runs.

concurrency:
  group: full-test-nightly
  cancel-in-progress: true

permissions:
  contents: read
  issues: write  # to open a regression issue on failure

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 2026-11-06 (CI-1): no debug info, as ci.yml's coverage job. With it,
      # linking ~159 app test binaries filled the runner disk eight nights in
      # a row ("No space left on device", then `ld` bus error).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # 2026-10-11: the 2026-10-10 run had 3.25 GB free when the storage
      # suite ran. The seal escalation spill refuses below its 4 GiB
      # free-disk floor by design, so its tests failed and a shared rescue
      # floor table left behind failed a tick_persistence test. The same
      # suite passes locally with disk (2,207 passed, 0 failed). Same recipe
      # as the ci.yml coverage job and the safety.yml jobs.
      - name: Free runner disk space (seal spill 4 GiB free-disk floor)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== df -h BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          echo "=== df -h AFTER cleanup ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned (was @stable, supply-chain hardening 2026-04-25)
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: full-test-nightly

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test --workspace --no-fail-fast
        id: test
        run: |
          set -o pipefail
          df -h /; trap 'echo "=== df -h after the build ==="; df -h /' EXIT
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test-output.log

      # Ported off actions/github-script to `gh` CLI (2026-08-11, rust-only
      # forever-lock); the body never passes through a parser, it is a file
      # handed to `--body-file`. 2026-11-06 (CI-2): one step, any failure
      # (an empty log still reports the run link), failure lines first, and
      # ONE open issue: a later failing night comments on it. The search
      # matches the old per-commit titles too, so the open duplicates are
      # reused rather than added to.
      - name: Report regression on the one open issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          log=/tmp/test-output.log; body=/tmp/nightly-issue-body.md; touch "$log"
          {
            echo "## Nightly full-workspace run failed @ ${COMMIT_SHA:0:7}"; echo "**Run:** ${RUN_URL}"
            echo "### Failure lines (FAILED, panicked, error[, No space left), first 60"; echo '```'
            grep -m 60 -E 'FAILED|panicked|error\[|No space left' "$log" || echo "(none in the test log: a step before the tests failed, see the run)"
            echo '```'; echo "### Failed test-result lines"; echo '```'
            grep -E '^test result: FAILED' "$log" | tail -30 || echo "(none)"
            echo '```'; echo "### Last 40 lines of output"; echo '```'; tail -40 "$log"; echo '```'
            echo "Triage: bisect the last 24h of commits; fix the test or the code, not the workflow; close this issue with the fix commit."
          } > "$body"
          # 2026-10-11: the labels did not exist, so the issue step failed
          # and no issue was ever opened. `--force` creates or updates them.
          gh label create nightly-regression --force --color B60205 --description "Nightly full-workspace test failure"
          gh label create auto-triage --force --color FBCA04 --description "Opened by a workflow for triage"
          num=$(gh issue list --state open --label nightly-regression --search 'in:title "nightly regression: full-workspace"' --limit 1 --json number --template '{{range .}}{{.number}}{{end}}')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file "$body"; exit 0; fi
          gh issue create --title "nightly regression: full-workspace tests failing" --body-file "$body" --label nightly-regression --label auto-triage

  # PROOF-5 (2026-10-12, deep audit): every other test job runs on x86_64
  # glibc, while production is an aarch64 musl static binary. Until now no
  # test, DHAT count or loom model had ever run on aarch64 or under musl.
  # This NIGHTLY job (not a PR job, so the All Green needs list is untouched)
  # runs the core, storage, trading and app suites built for
  # aarch64-unknown-linux-musl, then the loom models on native aarch64.
  #
  # HONEST LIMITS: the runner is a GitHub ARM host, not the r8g Graviton4
  # box, so it proves atomics ordering, musl allocator behaviour and DHAT
  # counts on aarch64 + musl, not production latency. The core DHAT targets
  # gated behind `--features dhat` are not built here (the plain suites run
  # the storage, trading and app DHAT targets). apt uses one mirror with
  # retries; a mirror outage fails the night and opens the issue below.
  # GitHub Actions minutes, not AWS spend.
  test-aarch64-musl:
    name: Test (aarch64-musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      # 2026-11-06 (CI-1): the runner was shut down (exit 143) while
      # compiling tickvault-app; no debug info, as the x86 job above.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk space (seal spill 4 GiB free-disk floor)
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          if command -v docker >/dev/null 2>&1; then sudo docker system prune -af >/dev/null 2>&1 || true; fi
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (aarch64 musl target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned
        with:
          toolchain: '1.95.0'
          targets: aarch64-unknown-linux-musl

      - name: Install musl build deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true \
            install -y --no-install-recommends cmake build-essential pkg-config musl-tools musl-dev

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: full-test-nightly-aarch64-musl

      - name: cargo test (aarch64-unknown-linux-musl)
        id: musl_test
        shell: bash
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          df -h /; trap 'echo "=== df -h after the build ==="; df -h /' EXIT
          cargo test --target aarch64-unknown-linux-musl --no-fail-fast \
            -p tickvault-core -p tickvault-storage -p tickvault-trading -p tickvault-app \
            2>&1 | tee /tmp/musl-test.log

      - name: Loom models (native aarch64)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p tickvault-core --features loom --test loom_activity_watchdog \
            --test loom_ghost_register --test loom_ws_decoupling
          cargo test -p tickvault-trading --features loom --test loom_circuit_breaker

      - name: Open regression issue on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create nightly-regression --force --color B60205 \
            --description "Nightly full-workspace test failure"
          # Keep one open issue: skip when an aarch64-musl regression issue is
          # already open (the sibling job above has no such check).
          gh issue list --state open --label nightly-regression --search 'in:title "nightly regression: aarch64-musl"' | grep -q . && exit 0
          gh issue create \
            --title "nightly regression: aarch64-musl tests failed @ ${COMMIT_SHA:0:7}" \
            --body "The nightly aarch64-musl test job failed. Run: ${RUN_URL}" \
            --label nightly-regression
