# =============================================================================
# tickvault — shared automatic/manual merge gate
# =============================================================================
# The at-open `pull_request` arming that used to live here is RETIRED.
#
# WHY: arming `gh pr merge --auto --squash` at PR open meant the merge fired
# the moment the branch-protection REQUIRED checks passed — and only 4 checks
# were required (Build & Verify, Security & Audit, Commit Lint, Secret Scan).
# On 2026-07-03, PRs #1387 / #1388 / #1382 merged seconds BEFORE their
# (non-required) Test (storage) job failed, turning main red for hours.
#
# Auto-merge is armed by the `enable-auto-merge` job in ci.yml, which calls
# this workflow with `needs: all-green` — AFTER the ENTIRE PR suite (build, all 6
# Test crates, security, coverage, repo guards, design-first wall, deploy
# lint) is green. Same token pattern, same same-repo/fork-safety guard from
# PR #1390. See .claude/rules/project/merge-gate-lock-2026-07-04.md.
#
# This file also provides an operator-initiated manual fallback (e.g. the
# ci.yml arming job was itself cancelled and the operator wants to re-arm
# without pushing an empty commit). Neither path arms at PR open: both
# require All Green and CI's release-validation result on the current head.
#
# Security: All actions pinned. Same-repo origin is re-verified via the API
# before arming — a fork PR can never be armed even via manual dispatch.
# =============================================================================

name: Auto-Merge

on:
  workflow_call:
    inputs:
      pr_number:
        description: Same-repository PR whose completed checks should be verified.
        required: true
        type: string
      source_sha:
        description: Exact PR head validated by the calling CI run.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to arm auto-merge (squash) on. Same-repo PRs only."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # Read the exact-head All Green and release check conclusions before arming.
  checks: read

jobs:
  auto-merge:
    name: "Verify checks and enable auto-merge"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify same-repo origin + non-draft, then arm auto-merge (squash)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.source_sha || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a plain integer, got: $PR_NUMBER"
            exit 1
          fi
          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          head_sha=$(jq -er '.head.sha' <<< "$pr")
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$EXPECTED_HEAD_SHA" != "$head_sha" ]; then
            echo "::error::PR head changed since the calling CI run — refusing to arm auto-merge."
            exit 1
          fi

          require_same_pr_head() {
            jq -e --arg repo "$REPO" --arg sha "$head_sha" '
              .state == "open" and .draft == false
              and .head.repo.full_name == $repo and .head.sha == $sha
              and .base.repo.full_name == $repo and .base.ref == "main"
            ' >/dev/null <<< "$1" || {
              echo "::error::PR must remain open, non-draft, from this repository, targeting main, and on the verified head."
              return 1
            }
          }
          require_same_pr_head "$pr"

          # Paginate every attempt. Ordering by completed_at can let an old
          # success hide a newer queued/in-progress rerun with a null finish
          # time. The newest check ID must itself be completed and successful.
          checks=$(gh api --paginate --slurp \
            "repos/${REPO}/commits/${head_sha}/check-runs?filter=all&per_page=100")
          for required_check in 'All Green' 'Release Validation / Release Validation Complete'; do
            verdict=$(jq -er --arg sha "$head_sha" --arg name "$required_check" '
              [ .[].check_runs[]
                | select(.name == $name and .head_sha == $sha
                    and .app.slug == "github-actions") ]
              | sort_by(.id) | last
              | if . == null then "missing"
                elif .status != "completed" then (.status // "missing-status")
                else (.conclusion // "missing-conclusion") end
            ' <<< "$checks")
            if [ "$verdict" != success ]; then
              echo "::error::${required_check} is '${verdict}' on head ${head_sha} — refusing to arm auto-merge."
              exit 1
            fi
          done

          # Recheck eligibility after the API reads; the CLI's head condition
          # also refuses a head change between this read and the merge request.
          require_same_pr_head "$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          echo "All Green and release validation succeeded on head ${head_sha} — arming auto-merge."
          gh pr merge --auto --squash --match-head-commit "$head_sha" \
            "https://github.com/${REPO}/pull/${PR_NUMBER}"
