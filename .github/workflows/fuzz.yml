# =============================================================================
# tickvault — Fuzz Testing (Weekly Scheduled)
# =============================================================================
# Runs cargo-fuzz targets weekly. Creates GitHub issue on crash.
# Catches panic/crash bugs from malformed input (WebSocket frames, configs).
#
# Issue deduplication: checks for existing open issue before creating a new one.
# Build vs crash: separates build step from fuzz step to avoid false positives.
# =============================================================================

name: Fuzz

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC — saves ~85% scheduled minutes vs daily
  workflow_dispatch:       # Allow manual trigger for on-demand testing
    inputs:
      fuzz_duration_secs:
        description: 'Seconds per target (default 3600 = 1h scheduled; manual can go higher)'
        required: false
        default: '3600'
        type: string

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  # Pin nightly to a specific date for reproducible builds.
  # Update periodically after verifying the new nightly compiles cleanly.
  NIGHTLY_VERSION: nightly-2026-03-15

jobs:
  # ---------------------------------------------------------------------------
  # Target drift check — added 2026-09-01
  # ---------------------------------------------------------------------------
  # fuzz/Cargo.toml declared FIVE [[bin]] targets while the matrix below listed
  # THREE, so `dhan_depth_packet` and `truedata_frame_decoder` compiled but were
  # executed by nothing. That is the same silent-drop class the DHAT lane's
  # drift check exists to catch (it has caught it three times), reproduced in
  # the one lane that lacked the guard. A new fuzz target must now appear in
  # BOTH fuzz/Cargo.toml and the matrix, or this job fails the run.
  fuzz-target-drift:
    name: "Fuzz Target Drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every declared fuzz target is actually run by the matrix
        run: |
          set -euo pipefail
          declared=$(grep -A2 '^\[\[bin\]\]' fuzz/Cargo.toml \
            | grep '^name' | sed 's/.*= *//' | tr -d '"' | LC_ALL=C sort)
          count=$(printf '%s\n' "$declared" | grep -c . || true)
          # Anti-vacuity floor: an empty scan must FAIL, never pass quietly.
          # A guard that reports green because it found nothing is the exact
          # false-OK this repository has retired repeatedly.
          if [ "$count" -eq 0 ]; then
            echo "::error::found ZERO [[bin]] targets in fuzz/Cargo.toml — the scanner is broken or the file moved; refusing to pass vacuously."
            exit 1
          fi
          # The 8-space anchor matches only the real matrix line, never the
          # grep pattern on this very line (which is indented further).
          matrix_line=$(grep -m1 -E '^ {8}target: \[' .github/workflows/fuzz.yml || true)
          if [ -z "$matrix_line" ]; then
            echo "::error::could not locate the fuzz matrix target list in .github/workflows/fuzz.yml — refusing to pass vacuously."
            exit 1
          fi
          missing=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            case "$matrix_line" in
              *"$t"*) ;;
              *) missing="$missing $t" ;;
            esac
          done <<< "$declared"
          if [ -n "$missing" ]; then
            echo "::error::fuzz/Cargo.toml declares target(s) the matrix never runs:$missing — add them to the matrix, or delete the [[bin]]. A declared-but-unrun fuzz target gates nothing while looking like coverage."
            exit 1
          fi
          echo "Fuzz matrix matches fuzz/Cargo.toml ($count targets)."

  fuzz:
    needs: fuzz-target-drift
    name: "Fuzz Targets (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [tick_parser, config_parser, ws_frame_wal_replay, dhan_depth_packet, truedata_frame_decoder]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain (required by cargo-fuzz)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: fuzz -> target
          prefix-key: fuzz-${{ env.NIGHTLY_VERSION }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@e76ddd6ceed25b6c2aa8dfe0ec368bf2fb77a498 # cargo-fuzz
        with:
          tool: cargo-fuzz

      - name: Check fuzz directory exists
        id: check
        run: |
          if [ -d "fuzz" ] && [ -f "fuzz/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No fuzz targets configured yet — skipping."
          fi

      - name: Build fuzz target (${{ matrix.target }})
        id: build
        if: steps.check.outputs.exists == 'true'
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} fuzz build ${{ matrix.target }} 2>&1 | tee /tmp/fuzz-build.log || {
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Fuzz target ${{ matrix.target }} failed to BUILD (not a crash). Check nightly compatibility."
            echo "=== Last 50 lines of build log ==="
            tail -50 /tmp/fuzz-build.log
            exit 1
          }

      - name: Run fuzz target (${{ matrix.target }})
        id: fuzz
        if: steps.check.outputs.exists == 'true' && steps.build.outcome == 'success'
        env:
          # PR #288 (#8 + Phase 12.3): scheduled runs use 3600s (1h), 12x the
          # prior 300s. 2 targets x 1h = 2h/week = 8h/month — ~0.4% of the
          # 2000-min/mo GH Actions free-tier budget. Still well within cost
          # per aws-budget.md. Manual dispatch can go higher for deep runs.
          FUZZ_SECS: ${{ github.event.inputs.fuzz_duration_secs || '3600' }}
        run: |
          # -rss_limit_mb=4096: increase RSS limit for ASan-instrumented builds.
          # -max_total_time=$FUZZ_SECS: stop after N seconds if no crash found.
          # outer `timeout` matches to prevent runaway.
          timeout "${FUZZ_SECS}" cargo +${{ env.NIGHTLY_VERSION }} fuzz run ${{ matrix.target }} \
            -- -max_total_time="${FUZZ_SECS}" -rss_limit_mb=4096 2>&1 | tee /tmp/fuzz-run.log || {
            EXIT_CODE=${PIPESTATUS[0]}
            if [ "$EXIT_CODE" -eq 124 ]; then
              echo "Fuzz run completed (timeout reached — no crashes found)"
            else
              echo "=== Fuzz run failed (exit code $EXIT_CODE) ==="
              echo "=== Last 50 lines ==="
              tail -50 /tmp/fuzz-run.log
              # Check if there's an actual crash artifact
              if ls fuzz/artifacts/${{ matrix.target }}/* 2>/dev/null; then
                echo "fuzz_crashed=true" >> "$GITHUB_OUTPUT"
                exit 1
              else
                echo "No crash artifact found — likely a runtime/memory issue, not a code bug."
                echo "fuzz_crashed=true" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
          }

      - name: Upload crash artifacts
        if: failure() && steps.fuzz.outputs.fuzz_crashed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 90

      # Ported off actions/github-script to `gh` CLI (2026-08-11, rust-only
      # forever-lock): the inline JS was an interpreted-language runtime the
      # `rust_only_guard` invocation scan could not see. Dedup semantics are
      # unchanged (exact-title match over the 100 newest open `fuzz` issues:
      # comment if found, else create). `matrix.target` now travels via
      # `env:` instead of being spliced into a JS template literal, and the
      # jq filter reads it through `env.TITLE` so no value is interpolated
      # into the query string.
      - name: Create issue on crash (deduplicated)
        if: failure() && steps.fuzz.outputs.fuzz_crashed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="🔴 Fuzz: Crash in ${TARGET}"
          export TITLE
          existing=$(gh issue list --state open --label fuzz --limit 100 \
            --json number,title --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')
          if [ -n "$existing" ]; then
            printf 'Still reproducing as of %s.\n\nSee: %s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN_URL" > /tmp/fuzz-comment.md
            gh issue comment "$existing" --body-file /tmp/fuzz-comment.md
            exit 0
          fi
          printf 'Fuzz testing found a crash in target `%s`.\n\nSee: %s\n\nCrash artifacts uploaded — reproduce with:\n```\ncargo +nightly fuzz run %s\n```\n' \
            "$TARGET" "$RUN_URL" "$TARGET" > /tmp/fuzz-body.md
          gh issue create --title "$TITLE" --body-file /tmp/fuzz-body.md \
            --label bug --label fuzz --label critical

      # Ported off actions/github-script to `gh` CLI (2026-08-11, rust-only
      # forever-lock) — same dedup semantics as the crash step above.
      - name: Create issue on build failure (deduplicated)
        if: failure() && steps.build.outputs.build_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="⚠️ Fuzz: Build failure for ${TARGET}"
          export TITLE
          existing=$(gh issue list --state open --label fuzz --limit 100 \
            --json number,title --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')
          if [ -n "$existing" ]; then
            printf 'Still failing as of %s.\n\nSee: %s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN_URL" > /tmp/fuzz-comment.md
            gh issue comment "$existing" --body-file /tmp/fuzz-comment.md
            exit 0
          fi
          printf 'Fuzz target `%s` failed to **build** (not a crash).\nThis is typically a nightly toolchain compatibility issue.\n\nSee: %s\n\nTo fix: update `NIGHTLY_VERSION` in `.github/workflows/fuzz.yml` to a compatible nightly date.\n' \
            "$TARGET" "$RUN_URL" > /tmp/fuzz-body.md
          gh issue create --title "$TITLE" --body-file /tmp/fuzz-body.md \
            --label bug --label fuzz
