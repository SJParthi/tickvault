# day-repair-2026-11-20.yml — the one-off repair of the held day 2026-11-20
# (daily-universe Quote 63, plan item UTC-REPAIR). The one SSM shell element
# it sends is rust-only lock §0.21 (owner-approved 2026-11-21).
#
# This file only DISPATCHES. Every decision about what is copied, dropped
# and rebuilt is the box's Rust `tickvault day-repair` subcommand
# (crates/app/src/day_repair/); the runner is the Rust tool
# `tv-day-repair-2026-11-20` (crates/app/src/bin/tv_day_repair_2026_11_20.rs).
#
# HOW TO RUN IT (never 08:00-16:30 IST on a trading day; refused after
# 2026-11-30 IST):
#   0. The commit's binary must be in s3://tv-prod-cold/deploys/<sha>/:
#      dispatch deploy-aws on main first if the merge deploy was skipped.
#   1. mode=dry on main. Read only: guards and the list of partitions and
#      files it would copy.
#   2. mode=apply confirm=REPAIR-2026-11-20: stops the app, copies the day's
#      wrong partitions and files to s3://tv-prod-cold/quarantine/ and checks
#      them, moves the files aside, drops the partitions, rebuilds the day
#      from its raw frames. Refused without a successful dry run on the same
#      commit.
#   3. mode=verify: checks the rebuilt day; only then writes the release
#      marker so the day's export and archive go ahead.
#
# CREDENTIALS: the stored keys with EC2 and SSM grants (the pair the earlier
# one-off rebuild used). No new role; nothing gains an S3 delete. Dispatch
# inputs reach the tool only through `env:`.
#
# DELETE THIS FILE, its budget rows in shell_budget_guard.rs, the runner and
# day_repair_ssm.rs in the first PR after a passed verify.

name: day-repair-2026-11-20
run-name: "day-repair-2026-11-20 (${{ inputs.mode }})"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry (read only; run this first), apply, or verify'
        required: true
        type: choice
        default: dry
        options: [dry, apply, verify]
      confirm:
        description: 'apply only: REPAIR-2026-11-20'
        required: false
        default: ''

concurrency:
  group: day-repair-2026-11-20
  cancel-in-progress: false # never interrupt a repair

permissions:
  contents: read
  actions: read # read deploy runs and this workflow's own dry runs

jobs:
  repair:
    name: Day repair (${{ inputs.mode }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned
        with:
          toolchain: 1.95.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build the runner
        run: cargo build --locked -p tickvault-app --bin tv-day-repair-2026-11-20

      - name: Run it
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/tv-day-repair-2026-11-20 --mode "$MODE" --sha "$SHA" --confirm "$CONFIRM" --report day-repair-report.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: day-repair-report-${{ inputs.mode }}
          path: day-repair-report.md
          retention-days: 90
