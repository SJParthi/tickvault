# S7-Step7 / Phase 7: Nightly dep auto-update workflow (Option A).
#
# Every night at 02:00 IST (20:30 UTC), runs the
# dep-freshness-scanner.sh hook and:
#
#   - PATCH drift: auto-opens a PR that bumps every patch version
#     + runs the full test suite. Labelled `auto/patch-bump`. The
#     PR auto-merges when the 12 pre-push gates pass.
#
#   - MINOR or MAJOR drift: opens a GitHub Issue tagged
#     `deps-drift-minor` / `deps-drift-major` for human review.
#     Never auto-merged — semver minor bumps can technically
#     change behavior and need explicit test verification.
#
#   - UNKNOWN: fails the scan and withholds all patch proposals.
#
# The two issue jobs use the `gh` CLI (ported off actions/github-script,
# 2026-10-12, deep audit RUST-8); the label-based dedup is unchanged.
#
# No human intervention required for the PATCH path. The operator's
# only job is triage the MINOR / MAJOR issues periodically.

name: dep-freshness-nightly

on:
  schedule:
    # 20:30 UTC = 02:00 IST. Runs every day including weekends because
    # crates.io releases don't care about NSE trading calendar.
    - cron: '30 20 * * *'
  workflow_dispatch:
    # Manual dispatch for operator-triggered runs.

concurrency:
  group: dep-freshness
  cancel-in-progress: true

permissions:
  contents: write       # to commit the bumped Cargo.toml
  pull-requests: write  # to open auto-update PRs
  issues: write         # to open minor/major drift issues

jobs:
  scan:
    name: Scan + auto-PR patch drift
    runs-on: ubuntu-24.04
    outputs:
      patch_count: ${{ steps.scan.outputs.patch_count }}
      minor_count: ${{ steps.scan.outputs.minor_count }}
      major_count: ${{ steps.scan.outputs.major_count }}
      report: ${{ steps.scan.outputs.report }}
      patch_plan: ${{ steps.scan.outputs.patch_plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned (was @master, supply-chain hardening 2026-04-25)
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run dep freshness scanner
        id: scan
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path scripts/dep-freshness/Cargo.toml
          bash .claude/hooks/dep-freshness-scanner.sh --write-plan /tmp/patches.json | tee /tmp/report.txt
          echo "patch_plan=$(base64 -w0 /tmp/patches.json)" >> "$GITHUB_OUTPUT"

          PATCH=$(grep -oE '^PATCH drift \([0-9]+' /tmp/report.txt | grep -oE '[0-9]+' || echo 0)
          MINOR=$(grep -oE '^MINOR drift \([0-9]+' /tmp/report.txt | grep -oE '[0-9]+' || echo 0)
          MAJOR=$(grep -oE '^MAJOR drift \([0-9]+' /tmp/report.txt | grep -oE '[0-9]+' || echo 0)

          echo "patch_count=${PATCH}" >> $GITHUB_OUTPUT
          echo "minor_count=${MINOR}" >> $GITHUB_OUTPUT
          echo "major_count=${MAJOR}" >> $GITHUB_OUTPUT

          # Save the full report as a multi-line output (base64 to avoid
          # special-character escaping).
          REPORT_B64=$(base64 -w0 /tmp/report.txt)
          echo "report=${REPORT_B64}" >> $GITHUB_OUTPUT

  auto_pr_patches:
    name: Auto-PR for PATCH drift
    runs-on: ubuntu-24.04
    needs: scan
    if: needs.scan.outputs.patch_count != '0' && needs.scan.outputs.patch_count != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned (was @master, supply-chain hardening 2026-04-25)
        with:
          toolchain: 1.95.0

      - name: Apply scanned patch proposals and refresh the lockfile
        env:
          PATCH_PLAN: ${{ needs.scan.outputs.patch_plan }}
          REPORT_B64: ${{ needs.scan.outputs.report }}
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_PLAN" | base64 -d > /tmp/patches.json
          bash .claude/hooks/dep-freshness-scanner.sh --apply-plan /tmp/patches.json
          cargo update --workspace
          {
            printf 'Automated patch updates from the nightly workspace scan.\n\n```\n'
            printf '%s' "$REPORT_B64" | base64 -d
            printf '\n```\n'
          } > /tmp/patch-pr.md

      - name: Run workspace check
        run: cargo check --workspace --locked

      - name: Run scoped test suites
        run: |
          cargo test --locked -p tickvault-common --lib
          cargo test --locked -p tickvault-storage --lib

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: |
            chore(deps): auto-bump ${{ needs.scan.outputs.patch_count }} patch versions

            Generated by dep-freshness-nightly workflow on ${{ github.run_started_at }}.
            All bumps are PATCH-level (same major.minor). The workspace
            compiles and scoped test suites pass. Full suite runs on merge.
          branch: auto/patch-bump-${{ github.run_id }}
          delete-branch: true
          title: "chore(deps): auto-bump ${{ needs.scan.outputs.patch_count }} patch versions"
          body-path: /tmp/patch-pr.md
          labels: |
            deps
            auto/patch-bump
          draft: false

  open_minor_issue:
    name: Open issue for MINOR drift
    runs-on: ubuntu-24.04
    needs: scan
    if: needs.scan.outputs.minor_count != '0' && needs.scan.outputs.minor_count != ''
    steps:
      - name: Create / update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Job outputs travel through env, never spliced into the script.
          REPORT_B64: ${{ needs.scan.outputs.report }}
          COUNT: ${{ needs.scan.outputs.minor_count }}
        run: |
          set -euo pipefail
          TITLE="Dep drift: ${COUNT} MINOR upgrades available"
          {
            printf '### MINOR dep drift detected by nightly scan\n\n'
            printf '**Generated:** %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '```\n'
            printf '%s' "$REPORT_B64" | base64 -d || printf '(the scanner report did not decode)'
            printf '\n```\n\n### What to do\n\n'
            printf '%s\n' \
              '1. Pick one dep at a time (don'\''t batch minors)' \
              '2. Bump in `Cargo.toml`' \
              '3. Run `cargo test --workspace`' \
              '4. Commit + push' \
              '' \
              'The 12 pre-push gates will catch any regression.' \
              ''
          } > /tmp/drift-body.md
          # Update the newest open issue with this label instead of spawning
          # duplicates (same rule as before the gh port).
          num=$(gh issue list --state open --label deps-drift-minor --limit 1 \
            --json number --template '{{range .}}{{.number}}{{end}}')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$TITLE" --body-file /tmp/drift-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/drift-body.md \
              --label deps --label deps-drift-minor
          fi

  open_major_issue:
    name: Open issue for MAJOR drift
    runs-on: ubuntu-24.04
    needs: scan
    if: needs.scan.outputs.major_count != '0' && needs.scan.outputs.major_count != ''
    steps:
      - name: Create / update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Job outputs travel through env, never spliced into the script.
          REPORT_B64: ${{ needs.scan.outputs.report }}
          COUNT: ${{ needs.scan.outputs.major_count }}
        run: |
          set -euo pipefail
          TITLE="Dep drift: ${COUNT} MAJOR upgrades available (API breaking)"
          {
            printf '### MAJOR dep drift detected by nightly scan\n\n'
            printf '**Generated:** %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '```\n'
            printf '%s' "$REPORT_B64" | base64 -d || printf '(the scanner report did not decode)'
            printf '\n```\n\n### What to do\n\n'
            printf '%s\n' \
              'Major version bumps are API breaking. Each one needs:' \
              '1. Read the upstream CHANGELOG for breaking changes' \
              '2. Open a dedicated branch `deps/major-<crate>`' \
              '3. Fix every call site that breaks' \
              '4. Run `cargo test --workspace`' \
              '5. Open a PR for explicit review' \
              '' \
              'Never auto-merge major bumps.' \
              ''
          } > /tmp/drift-body.md
          # Update the newest open issue with this label instead of spawning
          # duplicates (same rule as before the gh port).
          num=$(gh issue list --state open --label deps-drift-major --limit 1 \
            --json number --template '{{range .}}{{.number}}{{end}}')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$TITLE" --body-file /tmp/drift-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/drift-body.md \
              --label deps --label deps-drift-major
          fi
