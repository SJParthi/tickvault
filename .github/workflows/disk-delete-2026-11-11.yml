# ONE-OFF (owner Quote 56, 2026-11-11, card "One-off, these 4 only
# (Recommended)"): deletes ONLY the four Quote 52 leftovers (two volumes
# attached to nothing, two old snapshots) with the one-off role
# tv-prod-disk-delete-2026-11-11. Run `dry` first, then `apply`. The Rust tool
# holds the ids as constants, deletes a volume only when it is available and
# unattached, and verifies after. Deleted with its role and tool in the first
# PR after the run (rust-only lock §0.19).
name: One-off disk delete (2026-11-11)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (report only) or apply (delete)"
        required: true
        default: dry
        type: choice
        options:
          - dry
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: disk-delete-2026-11-11
  cancel-in-progress: false

jobs:
  delete:
    name: Delete the four leftovers (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: disk-delete-2026-11-11
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain 1.95.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned
        with:
          toolchain: '1.95.0'

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-test-app

      - name: Build the delete tool (before any AWS credentials exist)
        run: cargo build --locked -p tickvault-app --bin tv-disk-delete-2026-11-11

      - name: Configure AWS credentials (one-off role, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::208384284948:role/tv-prod-disk-delete-2026-11-11
          aws-region: ap-south-1
          role-session-name: tv-disk-delete-${{ github.run_id }}

      - name: Run the delete tool
        env:
          MODE: ${{ inputs.mode }}
        run: target/debug/tv-disk-delete-2026-11-11 "$MODE"
