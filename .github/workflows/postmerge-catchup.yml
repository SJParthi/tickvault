# =============================================================================
# Post-Merge Catch-up Dispatcher — bot merges must still run the full battery
# =============================================================================
# THE GAP (proven live 2026-07-04): PR #1392 was merged by github-actions[bot]
# — the ci.yml enable-auto-merge job arms native auto-merge using the
# workflow's own GITHUB_TOKEN, so the resulting merge/push event to main is
# attributed to GITHUB_TOKEN. GitHub SUPPRESSES push-triggered workflows for
# events created with GITHUB_TOKEN (recursion protection), so merge commit
# aafa226 landed on main with ZERO post-merge runs: no CI (coverage ratchet
# artifact), no Benchmarks & Perf Gate, no deploy-aws. Earlier merges (#1391)
# only fired post-merge runs because auto-merge had been armed with the
# operator's own token, so the merge was attributed to SJParthi.
#
# THE FIX (house pattern — cron/dispatch redundancy, same as
# deploy-aws-after-close.yml): GITHUB_TOKEN's suppression rule has a
# documented EXCEPTION — `workflow_dispatch` and `repository_dispatch` events
# DO trigger workflows even when created with GITHUB_TOKEN. So this ~30s
# scheduled job checks whether main HEAD has ANY run of ci.yml / bench.yml
# (any event, any status) and, if none exists, dispatches that workflow on
# main. ci.yml + bench.yml both carry `workflow_dispatch:` triggers and treat
# a dispatched main run exactly like a push-to-main run.
#
# LOOP SAFETY (self-terminating by construction): a dispatched run has
# event=workflow_dispatch and head_sha == main HEAD, so the next scheduled
# check finds it via the head_sha filter and does nothing. The head_sha
# filter also guarantees at-most-one dispatch per (workflow, SHA) — queued,
# in_progress, completed (incl. cancelled/failed) runs all count as "exists";
# this dispatcher backfills MISSING runs, it never re-runs red ones.
#
# deploy-aws.yml IS now handled here too (added 2026-07-09 after a market-open
# outage). It USED to be excluded on the theory that deploy-aws-after-close.yml
# gives it its own cron/dispatch redundancy — but that lane depends on GitHub's
# scheduler firing the 03:00/03:15 UTC (08:30/08:45 IST) morning crons, and
# GitHub SILENTLY DROPS cron slots under load. On 2026-07-09 both morning slots
# were dropped: #1449 (a boot-critical fast-boot fix) had bot-merged the night
# before (GITHUB_TOKEN suppressed its push-triggered deploy-aws), so NO deploy-aws
# run existed for main HEAD, the box auto-started 08:30 IST on the previous
# binary and booted dead, and #1449's first deploy was still queued at 09:51 IST
# — after recovery. This every-30-min, 7-days-a-week dispatcher is FAR less
# scheduler-drop-fragile than 5 fixed daily crons: it guarantees a deploy-aws RUN
# (hence the ARM build + a real, provenance-updating deploy once the box is up)
# exists for every main HEAD within ~30 min of ANY merge, bot or human. The
# existence check makes it self-terminating (one run per SHA) and it changes NO
# deploy-aws behaviour — deploy-aws's OWN market-hours guard + off-hours box-state
# skip still decide whether/when the swap happens; this dispatcher only TRIGGERS.
# The box-start deploy-watchdog Lambda remains the deterministic backstop that
# catches a stale-binary boot from the on-box provenance and pages + redeploys.
# 2026-10-20: on a day the NSE holiday gate stopped the box, the deploy-aws run
# this dispatches skips green (`DEPLOY_SKIP_REASON=holiday_stop`) without
# starting the box. That run still counts as covering the SHA here, so the
# redeploy is the watchdog's on the next weekday boot (binary_stale), not this.
# 2026-11-07: CORRECTED — "within ~30 min of ANY merge" no longer holds for
# deploy-aws. It self-started the stopped box twice on Sat 2026-11-07, so the
# deploy-aws lane is now dispatched ONLY on an IST trading day between 15:45
# and 16:05 IST, when the box is up by schedule: the catch-up never causes a
# box start. A bot merge outside that window deploys at the next one (or via
# deploy-aws-after-close's 15:46 / 16:16 IST crons); there is no pre-open
# catch-up deploy any more. The ci / bench / terraform-apply lanes still run
# at every firing. The paragraphs above describe the old 24x7 dispatch.
#
# HONEST ENVELOPE: cron/dispatch redundancy REDUCES but cannot ELIMINATE GitHub
# scheduler risk — the scheduler is external and can drop any or all slots. This
# moves the pre-open exposure from 2 fragile morning crons to 48 every-30-min
# slots + overnight lead time; the box-start watchdog is the AWS-native
# (scheduler-independent) deterministic catch.
#
# Cost: one job, no checkout, ~5 API reads + at most 4 dispatches per firing
# (~30s on ubuntu-latest) — negligible against free-tier minutes. Because the
# check is head_sha-run-EXISTENCE (not deployed-state), each SHA triggers at most
# ONE deploy-aws run ever — no overnight rebuild spam. terraform-apply.yml
# joined the backfill list 2026-07-14 (PR-C3 rider; path-guarded — see the
# inline note) so a bot-merged terraform change is no longer the last
# push-suppressed lane without dispatcher coverage.
name: Post-Merge Catch-up Dispatcher

on:
  schedule:
    # Every 30 minutes, all week. Bot merges can land any time a session is
    # driving PRs (weekends included), and the job is ~30s — simpler and
    # safer than a weekday-windowed cron that misses off-hours merges.
    # MEASURED 2026-10-24 → 2026-11-07: GitHub ran this only ~4-5 times a
    # day, at uneven times. So two extra weekday slots aim at the 15:45-16:05
    # IST deploy-aws window (2026-11-07, see the step): 10:18 UTC = 15:48 IST,
    # 10:24 UTC = 15:54 IST; the */30 slot adds 10:30 UTC = 16:00 IST. A late
    # or dropped slot only means the after-close crons deploy instead.
    - cron: '*/30 * * * *'
    - cron: '18 10 * * 1-5'
    - cron: '24 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # gh workflow run (create workflow_dispatch events)

concurrency:
  group: postmerge-catchup
  cancel-in-progress: false

jobs:
  catchup:
    name: "Dispatch missing post-merge runs"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Everything else goes through the GitHub API via the preinstalled gh
      # CLI. The ONE file read is the NSE calendar (2026-11-07, see the
      # trading-day note in the step below). continue-on-error: a failed
      # checkout must not stop the ci/bench backfill; with no file the
      # weekday check still holds (weekend = skip), only holidays are missed.
      - name: Read the NSE calendar (holidays + Muhurat dates)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: config/base.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Backfill main HEAD if it has no ci.yml / bench.yml run
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Fail-safe (round-3 review LOW, 2026-07-14): a transient gh-api
          # failure on the HEAD probe must not fail the step — every lane is
          # HEAD-derived, so we skip the whole pass and let the next 30-min
          # firing retry (same principle as the per-lane + tf_touched guards).
          head_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha 2>/dev/null || echo "")
          if ! [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::could not resolve main HEAD (transient API failure?) — skipping this catch-up pass; the next scheduled firing retries."
            exit 0
          fi
          echo "main HEAD = ${head_sha}"
          # Exported for the SSM-mirror step below. Written only AFTER the
          # 40-lowercase-hex validation above, so the mirror can never receive
          # an error string or a truncated sha.
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # 2026-09-08 — the sha the deploy-watchdog COMPARES against must be
          # "the sha the box SHOULD be running", not bare main HEAD.
          # deploy-aws.yml is PATH-FILTERED, so a docs-only merge advances
          # main HEAD without any deploy; mirroring HEAD would then make
          # `tv-<env>-binary-sha-stale` report a mismatch that reflects no
          # operational difference at all (the false-positive class recorded
          # in dhan-rest-only-noise-lock §2.3q's 2026-09-02 addendum). So the
          # mirror carries the NEWEST commit on main that touched one of
          # deploy-aws.yml's `on.push.paths` — the same list, kept in lockstep
          # by hand (crates/**, Cargo.toml, Cargo.lock, deploy/systemd/**,
          # deploy/docker/**, config/**, deploy/aws/cloudwatch-agent.json,
          # deploy/aws/prometheus.yaml, .github/workflows/deploy-aws.yml).
          # A FAILED code deploy still leaves the box behind this sha and still
          # pages; only the docs-only case stops manufacturing a mismatch.
          # Fail-safe: any API failure falls back to HEAD with a warning — a
          # possibly-false mismatch is the pre-2026-09-08 behaviour, never a
          # missed real one.
          deploy_sha=""
          deploy_date=""
          for p in 'crates' 'Cargo.toml' 'Cargo.lock' 'deploy/systemd' 'deploy/docker' 'config' 'deploy/aws/cloudwatch-agent.json' 'deploy/aws/prometheus.yaml' '.github/workflows/deploy-aws.yml'; do
            line=$(gh api "repos/${GH_REPO}/commits?sha=main&path=${p}&per_page=1" \
              --jq '.[0] | "\(.sha) \(.commit.committer.date)"' 2>/dev/null || echo "")
            sha="${line%% *}"; date="${line#* }"
            if [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] && [[ "${date}" > "${deploy_date}" ]]; then
              deploy_sha="${sha}"; deploy_date="${date}"
            fi
          done
          if ! [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::could not resolve the newest deploy-relevant sha — mirroring main HEAD instead (may produce a docs-only false mismatch)"
            deploy_sha="${head_sha}"
          fi
          echo "newest deploy-relevant sha = ${deploy_sha} (committed ${deploy_date:-unknown})"
          echo "deploy_sha=${deploy_sha}" >> "$GITHUB_OUTPUT"

          # 2026-11-07 — THE CATCH-UP NEVER CAUSES A BOX START. Owner, that
          # day: "today is saturday why the fuck server started". Two bot
          # merges had no push run, so this job dispatched deploy-aws.yml (runs
          # 42311495097, created 04:52 IST, and 42331877828, created 08:29 IST,
          # Sat 2026-11-07); a workflow_dispatch sets SHOULD_BE_UP=yes in its
          # "Ensure instance running" step, which self-started the stopped box,
          # deployed, then stopped it. The rule now: this job dispatches
          # deploy-aws.yml ONLY on an IST trading day (Muhurat counts; a
          # Saturday, Sunday or [[trading.nse_holidays]] date does not) AND
          # only inside the after-close window 15:45-16:05 IST, when the box is
          # up by schedule (stop 16:30), so deploy-aws finds it running.
          #   - 15:45: the earliest swap the market-hours guard allows.
          #   - 16:05: dispatch to swap measured at ~12.5 min and to done at
          #     ~14.5 min (run 42331877828: created 02:59:47Z, build 10m15s,
          #     swap re-gate 03:12:12Z, done 03:14:18Z), so a 16:05 dispatch
          #     finishes ~16:20, inside the 16:30 stop.
          #   - NO morning window: a dispatch must land 08:30-08:45 to swap
          #     before the 09:00 re-gate, the box only starts at 08:30, the
          #     swap would restart the app inside the 08:15-09:15 boot-prep
          #     band deploy-aws-after-close deliberately avoids, and this cron
          #     is measured to fire only ~4-5 times a day at uneven times.
          # Outside the window nothing is dispatched, so NO run exists for the
          # SHA and the next in-window firing (the weekday crons above), or
          # deploy-aws-after-close's 15:46 / 16:16 IST crons, deploy it. The
          # fix lives HERE, not in deploy-aws.yml, so a human dispatch of
          # deploy-aws.yml still deploys at any time on any day, unchanged.
          # ci.yml, bench.yml and terraform-apply.yml start no box and are
          # still backfilled at every firing. Pinned by
          # crates/common/tests/postmerge_catchup_trading_day_guard.rs.
          read -r ist_day ist_dow ist_hhmm < <(TZ=Asia/Kolkata date '+%F %u %H%M'); trading_day=yes; in_window=no; if [ "$((10#${ist_hhmm}))" -ge 1545 ] && [ "$((10#${ist_hhmm}))" -le 1605 ]; then in_window=yes; fi
          if ! grep -qxF "date = \"${ist_day}\"" <(grep -A1 -xF '[[trading.muhurat_trading_dates]]' config/base.toml 2>/dev/null) && { [ "${ist_dow}" -ge 6 ] || grep -qxF "date = \"${ist_day}\"" <(grep -A1 -xF '[[trading.nse_holidays]]' config/base.toml 2>/dev/null); }; then trading_day=no; fi
          echo "IST ${ist_day} ${ist_hhmm} dow=${ist_dow} trading_day=${trading_day} deploy_window=${in_window}"; dispatched=0
          # deploy-aws.yml is included so a bot-merged (push-suppressed) commit
          # still gets its ARM build + a real deploy run, as a second chance
          # beside the scheduler-drop-fragile deploy-aws-after-close crons
          # (2026-07-09 outage — see header). Since 2026-11-07 only inside
          # the trading-day 15:45-16:05 IST window above (it used to be any
          # time, which started the box overnight and at weekends). deploy-aws's
          # OWN market-hours guard + off-hours box-state skip are unchanged.
          #
          # terraform-apply.yml (added 2026-07-14, PR-C3 rider — merge-gate-lock
          # §3.1 dated edit): its push trigger is PATH-FILTERED
          # (deploy/aws/terraform/** + its own workflow file), so a bot-merged
          # terraform change was the LAST push-suppressed lane with no
          # dispatcher coverage — the 3 post-close crons are the same
          # scheduler-drop-fragile class as the 2026-07-09 deploy-aws outage.
          # Because the path filter makes "zero runs for HEAD" the NORMAL state
          # for non-terraform merges, the existence check alone would dispatch
          # an apply run on EVERY merge; the guard below therefore dispatches
          # ONLY when the HEAD commit actually touched the filtered paths.
          # Envelope: (a) the commit-files API returns up to 300 files — a
          # >300-file merge whose terraform change sits past the cap is missed
          # here; (b) HEAD-only coverage — a tf-touching bot merge that is
          # SUPERSEDED by a non-tf merge inside one 30-min window is never
          # backfilled by this lane (the new HEAD reads tf_touched=0 and old
          # SHAs are never rechecked). Both cases fall back to terraform-apply's
          # own post-close crons (fail-safe direction: a missed dispatch DEFERS
          # the apply, never doubles it; the apply is plan-gated +
          # DynamoDB-locked, so extras are free no-ops anyway).
          # Fail-safe (hostile review 2026-07-14, HIGH): `.files` can be null/
          # absent (truncated large-diff responses) and `gh api` can fail
          # transiently — under `set -euo pipefail` a bare failure here would
          # kill the WHOLE step and skip the ci/bench/deploy-aws backfills too
          # (recreating the 2026-07-09 outage class). `(.files // [])` +
          # `|| echo ""` + the numeric check degrade ONLY the terraform lane
          # (tf_touched=0 → skip), never the other three.
          tf_touched=$(gh api "repos/${GH_REPO}/commits/${head_sha}"             --jq '[ (.files // [])[].filename
                    | select(startswith("deploy/aws/terraform/")
                             or . == ".github/workflows/terraform-apply.yml") ]
                  | length' 2>/dev/null || echo "")
          [[ "${tf_touched}" =~ ^[0-9]+$ ]] || tf_touched=0
          echo "terraform-filtered files in HEAD commit: ${tf_touched}"

          for wf in ci.yml bench.yml deploy-aws.yml terraform-apply.yml; do
            if [ "${wf}" = "terraform-apply.yml" ] && [ "${tf_touched}" -eq 0 ]; then
              echo "terraform-apply.yml: HEAD commit touched no terraform-filtered paths — skipping (path-filtered lane)"
              continue
            fi
            if [ "${wf}" = "deploy-aws.yml" ] && { [ "${trading_day}" = "no" ] || [ "${in_window}" = "no" ]; }; then echo "::notice::deploy-aws.yml: NOT dispatched (IST ${ist_day} ${ist_hhmm}, trading_day=${trading_day}). The catch-up dispatches it only on an NSE trading day between 15:45 and 16:05 IST, when the box is up by schedule, so it never starts the box. The next such firing, or the 15:46 / 16:16 IST after-close crons, deploy it. To deploy now, run deploy-aws.yml from the Actions tab."; continue; fi
            # Any run (any event: push, pull_request, workflow_dispatch,
            # schedule; any status — queued/in_progress/success/failed/
            # cancelled) for this exact SHA counts as covered. So a deploy-aws
            # run that ends in a green off-hours no-op skip, or a market-hours
            # guard block, still counts — this dispatcher backfills MISSING runs,
            # it never re-runs (or re-builds) a SHA that already has one.
            # Fail-safe (round-2 review 2026-07-14, MEDIUM): a transient API
            # failure on ONE lane's existence probe must not kill the whole
            # step under set -euo pipefail (the same class the tf_touched
            # guard above closes) — and a non-numeric count must never fall
            # through to "lane already covered" (false-OK direction). A
            # failed probe SKIPS the lane loudly; the next 30-min firing
            # retries (skipping is safe — a missed dispatch defers, while a
            # blind dispatch could double-run deploy-aws).
            count=$(gh api \
              "repos/${GH_REPO}/actions/workflows/${wf}/runs?head_sha=${head_sha}&per_page=1" \
              --jq .total_count 2>/dev/null || echo "")
            if ! [[ "${count}" =~ ^[0-9]+$ ]]; then
              echo "::warning::existence probe for ${wf} failed (got '${count}') — skipping this lane; the next 30-min firing retries"
              continue
            fi
            if [ "${count}" -eq 0 ]; then
              echo "::warning::${wf} has ZERO runs for main HEAD ${head_sha} — a GITHUB_TOKEN bot merge (or a scheduler-dropped morning deploy cron) left it uncovered. Dispatching catch-up run on main."
              # A transient dispatch failure must not abort the REMAINING
              # lanes (hostile review 2026-07-14, MEDIUM) — the next 30-min
              # firing retries any lane still uncovered.
              if gh workflow run "${wf}" --ref main; then
                dispatched=$((dispatched + 1))
              else
                echo "::error::dispatch of ${wf} failed — the next 30-min firing retries"
              fi
            else
              echo "${wf}: ${count} run(s) already exist for ${head_sha} — nothing to do"
            fi
          done

          # 2026-11-07: one printf (was a 6-line block) pays for the
          # trading-day check above; the run-line budget only shrinks.
          printf '## Post-merge catch-up\n\n- main HEAD: `%s`\n- IST %s trading day: %s\n- catch-up runs dispatched: %s\n' "${head_sha}" "${ist_day}" "${trading_day}" "${dispatched}" >> "$GITHUB_STEP_SUMMARY"

      # 2026-09-02 — MIRROR main HEAD into SSM for the deploy-watchdog.
      #
      # Why this step is HERE and not in deploy-aws.yml: the watchdog compares
      # the on-box binary sha against main HEAD, and it asks GitHub for main
      # HEAD using /tickvault/<env>/operator/github-token. That parameter does
      # not exist, so the comparison had been dead for its whole life while
      # `tv-<env>-binary-sha-stale` read OK (treat_missing_data = notBreaching
      # turns a producer that declines to produce into a healthy-looking
      # alarm). This mirror removes the credential from the critical path.
      #
      # It must NOT move into deploy-aws.yml. That workflow writes GITHUB_SHA,
      # which IS main HEAD at deploy time, so a mirror written there would
      # always equal binary-git-sha and the staleness signal could never go
      # red. The mirror has to advance when MAIN advances, deploy or no
      # deploy — which is exactly what this every-30-minutes job already does.
      #
      # NON-FATAL by design, matching the deploy-aws provenance write: a failed
      # mirror write must never fail the dispatcher, whose actual job is
      # backfilling missing runs. The next 30-min firing retries.
      - name: Configure AWS credentials (mirror write)
        if: steps.probe.outputs.head_sha != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: tv-github-catchup-mirror-${{ github.run_id }}

      - name: Mirror the newest deploy-relevant main sha to SSM (deploy-provenance fallback)
        if: steps.probe.outputs.head_sha != ''
        continue-on-error: true
        shell: bash
        env:
          HEAD_SHA: ${{ steps.probe.outputs.deploy_sha || steps.probe.outputs.head_sha }}
        run: |
          set -euo pipefail
          # LOCKSTEP NOTE: the path below hardcodes the single real env (prod)
          # while terraform reads /tickvault/${var.environment}/deploy/
          # desired-git-sha (deploy-watchdog-lambda.tf + oidc.tf) — the three
          # MUST stay in lockstep; a staging env would need this
          # parameterized. Same convention as the deploy-aws.yml provenance
          # write it mirrors.
          #
          # Re-validate rather than trust the step output: a 40-lowercase-hex
          # check costs nothing and the value crosses a step boundary.
          if ! [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::refusing to mirror a non-hex sha to /tickvault/prod/deploy/desired-git-sha"
            exit 0
          fi
          if aws ssm put-parameter \
              --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
              --name "/tickvault/prod/deploy/desired-git-sha" \
              --type String \
              --overwrite \
              --value "${HEAD_SHA}"; then
            echo "mirrored the newest deploy-relevant main sha ${HEAD_SHA} to /tickvault/prod/deploy/desired-git-sha"
          else
            echo "::warning::mirror write failed — the deploy-watchdog falls back to the previous mirrored value (or to GitHub, if a token is present); the next 30-min firing retries"
          fi
