# =============================================================================
# tickvault — Scheduled Security Audit
# =============================================================================
# Runs weekly to catch new CVEs discovered after code was committed.
# Separate from CI — this catches vulnerabilities in existing dependencies.
#
# Security: All actions pinned to SHA. No mutable tags.
# =============================================================================

name: Security Audit

on:
  schedule:
    # Every Monday at 06:00 UTC (11:30 IST)
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: "Weekly Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95.0"

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # cargo-deny

      - name: Supply chain check (CVEs + licenses + bans + sources)
        run: cargo deny check

      - name: Check for yanked crates
        run: cargo audit --deny yanked
