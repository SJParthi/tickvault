# =============================================================================
# tickvault — Safety Net (Weekly Scheduled)
# =============================================================================
# UB detection, memory safety, concurrency bugs.
# Runs weekly (Monday 6 AM UTC). Creates GitHub issue on failure.
# These checks are too slow for per-PR CI but catch deep bugs.
#
# Issue deduplication: checks for existing open issue before creating a new one.
# Build vs test: separates build from test to distinguish compilation errors
# from actual sanitizer findings.
#
# Checks:
#   1. cargo-careful test — extra debug checking with FFI support
#   2. AddressSanitizer (ASan) — memory safety via nightly
#   3. ThreadSanitizer (TSan) — data race detection via nightly
# =============================================================================

name: Safety Net

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC
  workflow_dispatch:       # Allow manual trigger
  # Self-validate the workflow whenever it itself is edited on main —
  # ensures toolchain pin bumps (NIGHTLY_VERSION) and step changes run
  # against the new substrate at merge time instead of waiting up to a
  # week for the next scheduled cycle.
  push:
    branches: [main]
    paths:
      - '.github/workflows/safety.yml'

permissions:
  contents: read
  issues: write            # Create issues on failure

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin nightly to a specific date for reproducible builds.
  # Update periodically after verifying the new nightly compiles cleanly.
  # 2026-04-24: bumped from 2026-04-15 → 2026-04-20 to keep the pin under
  # the 14-day safety window. 2026-04-20 is proven working (weekly safety
  # run on that date surfaced issues #302 + #304 — i.e. the build +
  # sanitizer jobs ran end-to-end).
  # 2026-05-23: bumped from 2026-04-20 → 2026-05-19 to clear the three open
  # nightly-compatibility build failures #460 (cargo-careful), #461 (ASan),
  # #462 (TSan). The 2026-04-20 pin sat 33 days stale, outside the 14-day
  # window; recent workspace dep updates (incl. rustls 0.23 chain) required
  # a newer nightly to compile the sanitizer builds.
  NIGHTLY_VERSION: nightly-2026-05-19

jobs:
  # ---- cargo-careful: Extra debug checks ----
  careful:
    name: "cargo-careful test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain (required by cargo-careful)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          prefix-key: safety-${{ env.NIGHTLY_VERSION }}

      - name: Install cargo-careful
        uses: taiki-e/install-action@e76ddd6ceed25b6c2aa8dfe0ec368bf2fb77a498 # cargo-careful
        with:
          tool: cargo-careful

      - name: Build with cargo-careful
        id: build
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} careful test --workspace --no-run 2>&1 || {
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::cargo-careful build failed (not a test finding). Look for a compiler error (nightly compatibility) or 'No space left on device' / a linker 'Bus error' (runner disk full, see #1836)."
            exit 1
          }

      - name: Auto-close cargo-careful build-failure issue on green build
        if: steps.build.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '⚠️ Safety Net: cargo-careful build failure (nightly compatibility)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) { return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: `Auto-closed: cargo-careful builds clean on \`${process.env.NIGHTLY_VERSION || 'current pin'}\`.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Run careful tests
        id: test
        if: steps.build.outcome == 'success'
        env:
          TV_SKIP_PERF_ASSERTIONS: "1"
        run: |
          # pipefail (2026-10-04): without it this step read the exit code of
          # `tee`, so a failing careful test run passed green. The exit code is
          # captured first because PIPESTATUS is overwritten by the next command.
          set -o pipefail
          # --test-threads=1: reduces memory pressure on CI runners
          # TV_SKIP_PERF_ASSERTIONS: skip timing assertions (instrumentation = 10-100x slower)
          cargo +${{ env.NIGHTLY_VERSION }} careful test --workspace \
            -- --test-threads=1 2>&1 | tee /tmp/careful-test.log || {
            rc=${PIPESTATUS[0]}
            echo "test_failed=true" >> "$GITHUB_OUTPUT"
            echo "=== cargo-careful test failed (exit code: ${rc}) ==="
            echo "=== Failed tests ==="
            grep -E "^test .+ FAILED|^failures:" /tmp/careful-test.log || true
            echo "=== Last 80 lines ==="
            tail -80 /tmp/careful-test.log
            exit 1
          }

      - name: Auto-close cargo-careful runtime issue on green run
        if: steps.test.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '🔴 Safety Net: cargo-careful found issues';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) { return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: `Auto-closed: cargo-careful green on \`${process.env.NIGHTLY_VERSION || 'current pin'}\`.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Create issue on test failure (deduplicated)
        if: failure() && steps.test.outputs.test_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '🔴 Safety Net: cargo-careful found issues';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still reproducing as of ${new Date().toISOString()}.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Weekly safety scan detected potential undefined behavior.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis requires investigation.`,
              labels: ['bug', 'safety', 'critical'],
            });

      - name: Create issue on build failure (deduplicated)
        if: failure() && steps.build.outputs.build_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '⚠️ Safety Net: cargo-careful build failure (nightly compatibility)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still failing as of ${new Date().toISOString()}.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `cargo-careful tests failed to **build** (not a test finding).\nTwo known causes: a nightly toolchain incompatibility (a compiler error in the log), or runner disk exhaustion ('No space left on device', or a linker 'Bus error'; see #1836).\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTo fix: for a compiler error, update \`NIGHTLY_VERSION\` in \`.github/workflows/safety.yml\`; for disk exhaustion, free runner space the way the sanitizer jobs do.`,
              labels: ['bug', 'safety'],
            });

  # ---- AddressSanitizer: Memory safety ----
  #
  # RUNNER DISK EXHAUSTION (2026-10-01, issue #1836). This job failed to
  # BUILD every week from 2026-08-31 to 2026-09-28. The nightly pin was not
  # the cause: the linker died with "signal 7 [Bus error]" inside rust-lld,
  # which is what an mmap'd output file does when the disk fills, and the
  # TSan runner died mid-build with its log lost. Measured locally on the
  # 2026-09-30 main (nightly-2026-05-19, same command as the build step):
  #   - as it was: ran out of disk and did not finish;
  #   - line-tables-only everywhere: still unfinished at 27 GB, with the
  #     same "ld terminated with signal 7 [Bus error]" as CI;
  #   - line-tables-only for workspace crates, no debug info for
  #     dependencies and std: finished, 17 GB, 384 test executables.
  # The per-crate test loop then rebuilt ~70 dependency crates PER PACKAGE
  # (`cargo test -p X` unifies features for X alone, so hashes differ from
  # the workspace build): +6 GB for just common and app. Workspace feature
  # unification makes every `-p X` reuse the build step's artifacts
  # (measured: 0 crates recompiled for api, storage, app --bins).
  # So, the same in the TSan job:
  #   1. Free the ~25-30 GB of preinstalled toolchains this job never uses
  #      (same recipe as ci.yml's Coverage & Perf job).
  #   2. Debug info: line tables for our crates, none for dependencies
  #      (the `--config` on each cargo call). Instrumentation is unchanged.
  #      A probe heap overflow still reported `src/lib.rs:1:45` and the
  #      test's `tests/oob.rs:4:13`; frames inside dependencies keep their
  #      function names and lose file:line.
  #   3. Workspace feature unification (nightly-only, job env), so the
  #      test loop links nothing new.
  # The "Report runner disk (issue 1836)" step prints df after the build
  # either way, so a future squeeze shows up as a number, not a linker crash.
  sanitizer-asan:
    name: "AddressSanitizer"
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_UNSTABLE_FEATURE_UNIFICATION: "true"
      CARGO_RESOLVER_FEATURE_UNIFICATION: workspace
    steps:
      - name: Free runner disk space (see the job comment above)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== df -h BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          echo "=== df -h AFTER cleanup ==="
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain (required by sanitizers)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          prefix-key: safety-${{ env.NIGHTLY_VERSION }}

      - name: Build with AddressSanitizer
        id: build
        env:
          RUSTFLAGS: "-Z sanitizer=address"
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} test --workspace \
            --config 'profile.dev.package."*".debug=false' \
            --target x86_64-unknown-linux-gnu \
            -Z build-std \
            --lib --tests \
            --no-run 2>&1 || {
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::AddressSanitizer build failed (not a runtime finding). Look for a compiler error (nightly compatibility) or 'No space left on device' / a linker 'Bus error' (runner disk full, see #1836)."
            exit 1
          }

      - name: "Report runner disk (issue 1836)"
        if: always()
        shell: bash
        run: |
          df -h /
          du -sh target 2>/dev/null || true

      - name: Auto-close ASan build-failure issue on green build
        if: steps.build.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '⚠️ Safety Net: ASan build failure (nightly compatibility)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) { return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: `Auto-closed: ASan builds clean on \`${process.env.NIGHTLY_VERSION || 'current pin'}\`.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Run tests with AddressSanitizer
        id: test
        if: steps.build.outcome == 'success'
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          TV_SKIP_PERF_ASSERTIONS: "1"
          # halt_on_error=1 ensures ASan-detected issues actually fail the
          # test process (default is print-and-continue, which silently lets
          # the test exit 0 and falsely greens the workflow).
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0"
        run: |
          # Per-crate loop (2026-07-14, #1494/#1495): the previous single
          # `cargo test --workspace` invocation stopped at the FIRST failing
          # test binary, so one plain test failure blinded the sanitizer
          # scan for every remaining crate (run 29230855037 scanned ONLY
          # tickvault-api). Each crate now runs its own suite with
          # --no-fail-fast; failures accumulate and the per-crate PASS/FAIL
          # summary below proves exactly which crates were scanned.
          # Feature parity note (2026-07-14 hostile-review HIGH, then
          # PR-C3 same day): the per-crate `--features daily_universe_fetcher`
          # injections were REMOVED in PR-C3 — the feature was deleted with
          # the Dhan instrument chain (the formerly-gated modules are now
          # UN-GATED and always compiled, so default-feature runs scan
          # them). The app crate still gets `--bins` because its bin target
          # carries #[test] fns that `--lib --tests` never runs. Budget:
          # ONE feature configuration — the -Z build-std artifacts build
          # once and are reused across every crate.
          set -o pipefail
          : > /tmp/asan-test.log
          declare -A verdict
          failed=()
          # Order retained from the two-configuration era (PR-C3 collapsed
          # it to ONE configuration — the feature is deleted; order is now
          # cosmetic).
          crates="tickvault-common tickvault-trading tickvault-api tickvault-storage tickvault-core tickvault-app"
          extra_args() {
            case "$1" in
              # PR-C3 (2026-07-14): the core/storage daily_universe_fetcher
              # arm was removed — the feature is deleted; those modules are
              # un-gated and scanned under default features.
              # App bin target carries #[test] fns --lib --tests never runs.
              tickvault-app) echo "--bins" ;;
              *) echo "" ;;
            esac
          }
          for p in $crates; do
            echo "::group::ASan: ${p}"
            if cargo +${{ env.NIGHTLY_VERSION }} test -p "$p" \
              --config 'profile.dev.package."*".debug=false' \
              --target x86_64-unknown-linux-gnu \
              -Z build-std \
              --lib --tests $(extra_args "$p") --no-fail-fast \
              -- --test-threads=1 2>&1 | tee -a /tmp/asan-test.log; then
              verdict[$p]=PASS
            else
              verdict[$p]=FAIL
              failed+=("$p")
            fi
            echo "::endgroup::"
          done
          echo "=== ASan per-crate summary ==="
          for p in $crates; do
            printf '%-20s %s\n' "$p" "${verdict[$p]}"
          done
          # Honest issue filing: distinguish a REAL sanitizer finding from a
          # plain test/harness failure under the sanitizer build.
          if grep -q "ERROR: AddressSanitizer" /tmp/asan-test.log; then
            echo "sanitizer_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "sanitizer_report=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "test_failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_crates=${failed[*]}" >> "$GITHUB_OUTPUT"
            echo "::error::ASan lane failed in: ${failed[*]}"
            exit 1
          fi

      - name: Auto-close ASan runtime issue on green run
        if: steps.test.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Close BOTH the real-finding title and the honest
            // no-report-lane-failure title on a green run.
            const titles = [
              '🔴 Safety Net: AddressSanitizer found memory issues',
              'safety: ASan lane failed (no sanitizer report — test/build failure)',
            ];
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            for (const title of titles) {
              const match = existing.find(i => i.title === title);
              if (!match) { continue; }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Auto-closed: ASan green on \`${process.env.NIGHTLY_VERSION || 'current pin'}\`.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Create issue on test failure (deduplicated)
        if: failure() && steps.test.outputs.test_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Honest filing (#1495): only claim "found memory issues" when
            // the captured log carries a real `ERROR: AddressSanitizer`
            // banner; a plain test failure under the sanitizer build gets
            // an honest title instead.
            const hasReport = '${{ steps.test.outputs.sanitizer_report }}' === 'true';
            const failedCrates = '${{ steps.test.outputs.failed_crates }}' || 'unknown';
            const title = hasReport
              ? '🔴 Safety Net: AddressSanitizer found memory issues'
              : 'safety: ASan lane failed (no sanitizer report — test/build failure)';
            const detail = hasReport
              ? 'Weekly safety scan detected memory safety issues (use-after-free, buffer overflow, etc.).\n\nThis requires immediate investigation.'
              : 'The ASan job failed, but the captured test log contains NO `ERROR: AddressSanitizer` banner — this is a plain test (or harness) failure under the sanitizer build, NOT a memory-safety finding. Fix the failing test; the sanitizer itself reported nothing.';
            const labels = hasReport ? ['bug', 'safety', 'critical'] : ['bug', 'safety'];
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still reproducing as of ${new Date().toISOString()} (failed crates: ${failedCrates}).\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `${detail}\n\nFailed crates: ${failedCrates}\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels,
            });

      - name: Create issue on build failure (deduplicated)
        if: failure() && steps.build.outputs.build_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '⚠️ Safety Net: ASan build failure (nightly compatibility)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still failing as of ${new Date().toISOString()}.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `AddressSanitizer tests failed to **build** (not a runtime finding).\nTwo known causes: a nightly toolchain incompatibility (a compiler error in the log), or runner disk exhaustion ('No space left on device', or a linker 'Bus error'; see #1836).\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTo fix: for a compiler error, update \`NIGHTLY_VERSION\` in \`.github/workflows/safety.yml\`; for disk exhaustion, check the \"Report runner disk\" step and shrink the build or free more space.`,
              labels: ['bug', 'safety'],
            });

  # ---- ThreadSanitizer: Data races ----
  # Runner disk: same three mitigations as the ASan job, for the same reason
  # (#1836). See the comment above `sanitizer-asan`. The sizes there were
  # measured on the ASan build; this job builds the same test set with
  # different instrumentation.
  sanitizer-tsan:
    name: "ThreadSanitizer"
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_UNSTABLE_FEATURE_UNIFICATION: "true"
      CARGO_RESOLVER_FEATURE_UNIFICATION: workspace
    steps:
      - name: Free runner disk space (see the ASan job comment)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== df -h BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          echo "=== df -h AFTER cleanup ==="
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          prefix-key: safety-${{ env.NIGHTLY_VERSION }}

      - name: Build with ThreadSanitizer
        id: build
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} test --workspace \
            --config 'profile.dev.package."*".debug=false' \
            --target x86_64-unknown-linux-gnu \
            -Z build-std \
            --lib --tests \
            --no-run 2>&1 || {
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::ThreadSanitizer build failed (not a runtime finding). Look for a compiler error (nightly compatibility) or 'No space left on device' / a linker 'Bus error' (runner disk full, see #1836)."
            exit 1
          }

      - name: "Report runner disk (issue 1836)"
        if: always()
        shell: bash
        run: |
          df -h /
          du -sh target 2>/dev/null || true

      - name: Auto-close TSan build-failure issue on green build
        if: steps.build.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '⚠️ Safety Net: TSan build failure (nightly compatibility)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) { return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: `Auto-closed: TSan builds clean on \`${process.env.NIGHTLY_VERSION || 'current pin'}\`.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Run tests with ThreadSanitizer
        id: test
        if: steps.build.outcome == 'success'
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
          TV_SKIP_PERF_ASSERTIONS: "1"
          # halt_on_error=1 ensures TSan-detected races actually fail the
          # test process. history_size=7 widens TSan's memory-access ring
          # buffer so racy stacktraces aren't truncated under heavy test
          # load (the workspace test count is large).
          TSAN_OPTIONS: "halt_on_error=1:history_size=7"
        run: |
          # Per-crate loop (2026-07-14, #1494/#1495): the previous single
          # `cargo test --workspace` invocation stopped at the FIRST failing
          # test binary, so one plain test failure blinded the sanitizer
          # scan for every remaining crate (run 29230855037 scanned ONLY
          # tickvault-api). Each crate now runs its own suite with
          # --no-fail-fast; failures accumulate and the per-crate PASS/FAIL
          # summary below proves exactly which crates were scanned.
          # Feature parity note (2026-07-14 hostile-review HIGH, then
          # PR-C3 same day): the per-crate `--features daily_universe_fetcher`
          # injections were REMOVED in PR-C3 — the feature was deleted with
          # the Dhan instrument chain (the formerly-gated modules are now
          # UN-GATED and always compiled, so default-feature runs scan
          # them). The app crate still gets `--bins` because its bin target
          # carries #[test] fns that `--lib --tests` never runs. Budget:
          # ONE feature configuration — the -Z build-std artifacts build
          # once and are reused across every crate.
          set -o pipefail
          # One suppression, for one reproduced false positive in tokio
          # (issue 1990). tokio hands each socket's ScheduledIo to the I/O
          # driver thread as the epoll token, and TSan sees no ordering
          # between the registering thread's Arc::new and the driver's read.
          # A 25-line tokio-only program (tokio =1.53.1, multi-thread
          # runtime, one TcpStream::connect) reports the same two warnings.
          # The rule matches only races whose stacks pass through tokio's
          # RegistrationSet::allocate; a deliberate race in our own code is
          # still reported under it. print_suppressions=1 prints how many
          # reports it hid, so the log shows its reach every run.
          tsan_supp="$RUNNER_TEMP/tsan-suppressions.txt"
          printf '%s\n' \
            'race:tokio::runtime::io::registration_set::RegistrationSet>::allocate' \
            > "$tsan_supp"
          export TSAN_OPTIONS="${TSAN_OPTIONS}:suppressions=${tsan_supp}:print_suppressions=1"
          : > /tmp/tsan-test.log
          declare -A verdict
          failed=()
          # Order retained from the two-configuration era (PR-C3 collapsed
          # it to ONE configuration — the feature is deleted; order is now
          # cosmetic).
          crates="tickvault-common tickvault-trading tickvault-api tickvault-storage tickvault-core tickvault-app"
          extra_args() {
            case "$1" in
              # PR-C3 (2026-07-14): the core/storage daily_universe_fetcher
              # arm was removed — the feature is deleted; those modules are
              # un-gated and scanned under default features.
              # App bin target carries #[test] fns --lib --tests never runs.
              tickvault-app) echo "--bins" ;;
              *) echo "" ;;
            esac
          }
          for p in $crates; do
            echo "::group::TSan: ${p}"
            if cargo +${{ env.NIGHTLY_VERSION }} test -p "$p" \
              --config 'profile.dev.package."*".debug=false' \
              --target x86_64-unknown-linux-gnu \
              -Z build-std \
              --lib --tests $(extra_args "$p") --no-fail-fast \
              -- --test-threads=1 2>&1 | tee -a /tmp/tsan-test.log; then
              verdict[$p]=PASS
            else
              verdict[$p]=FAIL
              failed+=("$p")
            fi
            echo "::endgroup::"
          done
          echo "=== TSan per-crate summary ==="
          for p in $crates; do
            printf '%-20s %s\n' "$p" "${verdict[$p]}"
          done
          # Honest issue filing: distinguish a REAL sanitizer finding from a
          # plain test/harness failure under the sanitizer build.
          if grep -q "WARNING: ThreadSanitizer" /tmp/tsan-test.log; then
            echo "sanitizer_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "sanitizer_report=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "test_failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_crates=${failed[*]}" >> "$GITHUB_OUTPUT"
            echo "::error::TSan lane failed in: ${failed[*]}"
            exit 1
          fi

      - name: Auto-close TSan runtime issue on green run
        if: steps.test.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Close BOTH the real-finding title and the honest
            // no-report-lane-failure title on a green run.
            const titles = [
              '🔴 Safety Net: ThreadSanitizer found data races',
              'safety: TSan lane failed (no sanitizer report — test/build failure)',
            ];
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            for (const title of titles) {
              const match = existing.find(i => i.title === title);
              if (!match) { continue; }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Auto-closed: TSan green on \`${process.env.NIGHTLY_VERSION || 'current pin'}\`.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Create issue on test failure (deduplicated)
        if: failure() && steps.test.outputs.test_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Honest filing (#1495): only claim "found data races" when the
            // captured log carries a real `WARNING: ThreadSanitizer` banner;
            // a plain test failure under the sanitizer build gets an honest
            // title instead.
            const hasReport = '${{ steps.test.outputs.sanitizer_report }}' === 'true';
            const failedCrates = '${{ steps.test.outputs.failed_crates }}' || 'unknown';
            const title = hasReport
              ? '🔴 Safety Net: ThreadSanitizer found data races'
              : 'safety: TSan lane failed (no sanitizer report — test/build failure)';
            const detail = hasReport
              ? 'Weekly safety scan detected data race conditions.\n\nThis requires investigation — data races in trading systems can cause incorrect fills.'
              : 'The TSan job failed, but the captured test log contains NO `WARNING: ThreadSanitizer` banner — this is a plain test (or harness) failure under the sanitizer build, NOT a data-race finding. Fix the failing test; the sanitizer itself reported nothing.';
            const labels = hasReport ? ['bug', 'safety', 'critical'] : ['bug', 'safety'];
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still reproducing as of ${new Date().toISOString()} (failed crates: ${failedCrates}).\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `${detail}\n\nFailed crates: ${failedCrates}\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels,
            });

      - name: Create issue on build failure (deduplicated)
        if: failure() && steps.build.outputs.build_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = '⚠️ Safety Net: TSan build failure (nightly compatibility)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'safety',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still failing as of ${new Date().toISOString()}.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `ThreadSanitizer tests failed to **build** (not a runtime finding).\nTwo known causes: a nightly toolchain incompatibility (a compiler error in the log), or runner disk exhaustion ('No space left on device', or a linker 'Bus error'; see #1836).\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTo fix: for a compiler error, update \`NIGHTLY_VERSION\` in \`.github/workflows/safety.yml\`; for disk exhaustion, check the \"Report runner disk\" step and shrink the build or free more space.`,
              labels: ['bug', 'safety'],
            });
