# wipe-2026-10-31.yml — the one-off full market-data wipe (plan item 67),
# brought forward to the night of Tuesday 2026-10-27 by Quote 42 (plan item
# X1). The file, environment, role and confirm word keep their names.
#
# Authorization: operator Quote 35 (2026-10-21) and Quote 42 (2026-10-27),
# recorded in
# docs/claude-rules-full/project/daily-universe-scope-expansion-2026-05-27.md.
# Quote 42: apply from 2026-10-27 18:00 IST, data dated before 2026-10-28,
# the old-root snapshot not before 2026-10-28 16:30 IST. The one SSM shell
# element it sends is rust-only lock §0.14 (approved 2026-10-22; window
# amended by Quote 42).
#
# This file only DISPATCHES. Every decision about what is deleted and kept is
# the Rust tool `tv-wipe-2026-10-31` (crates/app/src/bin/wipe_2026_10_31.rs)
# and the pure classifiers in crates/app/src/wipe_2026_10_31.rs; the on-box
# half is `tickvault wipe-box`, sent over SSM as one fixed command
# (crates/app/src/wipe_ssm.rs).
#
# HOW TO RUN IT
#   1. mode=dry phase=all on main, any time before 2026-11-02 IST. Deletes
#      nothing: lists every box file, partition, S3 version and snapshot it
#      would delete and everything it keeps. (A stopped box is started for
#      the box inventory and stopped again.)
#   2. From 18:00 IST on Tuesday 2026-10-27 (until 08:00 IST on 1 Nov, never
#      09:00-15:45 IST): mode=apply phase=all confirm=WIPE-BEFORE-2026-11-01.
#      The box job stops the app, deletes the files and partitions dated
#      before 2026-10-28, stops the box; then the cloud job deletes the old
#      S3 versions (with Quote 43, the rebuild's copies of the spill files
#      too) and lists again. Before 16:30 IST on 2026-10-28 the
#      old-root snapshot is KEPT and the job says so. Apply refuses without a
#      successful dry run on the same commit, outside the window, or while a
#      deploy is queued or running.
#   3. After 16:30 IST on Wednesday 2026-10-28, with the box stopped:
#      mode=dry phase=all, then mode=apply phase=cloud deletes the snapshot.
#      A failed cloud job can be re-run alone with phase=cloud.
#
# CREDENTIALS: the box job uses the stored keys with EC2 and SSM grants (the
# same pair the deleted 2026-10-22 rebuild used). The cloud job assumes the one-off
# role tv-prod-wipe-2026-10-31 (deploy/aws/terraform/wipe-2026-10-31.tf),
# trusted only by the environment wipe-2026-10-31 and expiring at the end of
# 2026-11-01 IST. Dispatch inputs reach the tool only through `env:`.
#
# DELETE THIS FILE, its budget rows in shell_budget_guard.rs, the tool and
# the role in the PR after the run (as the Quote 29e tool was).

name: wipe-2026-10-31
run-name: "wipe-2026-10-31 (${{ inputs.mode }} ${{ inputs.phase }})"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry (deletes nothing; run this first) or apply'
        required: true
        type: choice
        default: dry
        options: [dry, apply]
      phase:
        description: 'all (box, then S3 and snapshot), box, or cloud (S3 and snapshot only)'
        required: true
        type: choice
        default: all
        options: [all, box, cloud]
      confirm:
        description: 'apply only: WIPE-BEFORE-2026-11-01'
        required: false
        default: ''

concurrency:
  group: wipe-2026-10-31
  cancel-in-progress: false # never interrupt a delete

permissions:
  contents: read
  actions: read # read deploy runs and this workflow's own dry runs

jobs:
  box:
    name: Box (${{ inputs.mode }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 240
    outputs:
      account: ${{ steps.box.outputs.account }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned
        with:
          toolchain: 1.95.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build the wipe tool
        run: cargo build --locked -p tickvault-app --bin tv-wipe-2026-10-31

      - name: Run the box phase (preflight only when phase=cloud)
        id: box
        env:
          MODE: ${{ inputs.mode }}
          PHASE: ${{ inputs.phase == 'cloud' && 'preflight' || 'box' }}
          CONFIRM: ${{ inputs.confirm }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/tv-wipe-2026-10-31 --mode "$MODE" --phase "$PHASE" --sha "$SHA" --confirm "$CONFIRM" --report wipe-box-report.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wipe-box-report-${{ inputs.mode }}-${{ inputs.phase }}
          path: wipe-box-report.md
          retention-days: 90

  cloud:
    name: S3 and snapshot (${{ inputs.mode }})
    needs: box
    if: github.ref == 'refs/heads/main' && inputs.phase != 'box' && needs.box.result == 'success'
    runs-on: ubuntu-24.04
    # The one-off role trusts ONLY this environment's OIDC subject.
    environment: wipe-2026-10-31
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # SHA-pinned
        with:
          toolchain: 1.95.0

      - name: Configure AWS credentials (OIDC, one-off role only)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.box.outputs.account }}:role/tv-prod-wipe-2026-10-31
          aws-region: ap-south-1
          role-session-name: tv-wipe-2026-10-31-${{ github.run_id }}

      - name: Build the wipe tool
        run: cargo build --locked -p tickvault-app --bin tv-wipe-2026-10-31

      - name: Run the S3 and snapshot phases
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/tv-wipe-2026-10-31 --mode "$MODE" --phase cloud --sha "$SHA" --confirm "$CONFIRM" --report wipe-cloud-report.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wipe-cloud-report-${{ inputs.mode }}-${{ inputs.phase }}
          path: wipe-cloud-report.md
          retention-days: 90
