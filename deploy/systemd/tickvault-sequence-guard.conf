# Persistent compatibility admission. Installed independently of the base
# unit and excluded from release rollback snapshots. Never remove to start
# an old binary; use the fenced authority-aware recovery protocol.
[Service]
# Conditions execute before every ExecStartPre, including QuestDB self-heal.
# run revalidates again immediately before pinning/executing the app inode.
ExecCondition=/usr/local/libexec/tickvault-start-guard check
ExecStart=
ExecStart=/usr/local/libexec/tickvault-start-guard run
