# =============================================================================
# tickvault — Docker Compose
# =============================================================================
# Same file on Mac dev and AWS prod (t4g.medium ARM Graviton2, 2 vCPUs / 4 GiB,
# operator-lock 2026-07-15 Quote 8 in daily-universe-scope-expansion-2026-05-27.md §7).
#
# Post-CloudWatch-only migration (#O1/#O2/#O3/#O4), Groww-only ~770-SID universe.
#   Compose default QDB_MEM_LIMIT=12g — the r8g.xlarge 32 GiB host (operator
#   Quote 13, 2026-08-08), per §7 Rule 2: QuestDB 8–16 GB + resident ticks
#   2.3–7.2 GB + app 2–4 GB + OS/FS-cache 2–4 GB = ~14–31 GB of 32 GiB.
#   History: 4g on r8g.large (2026-07-01 → 2026-07-15), then 1g on the
#   t4g.medium downsize (2026-07-15 → 2026-08-10).
#
#   ⚠ THE REPO CHANGE ALONE DOES NOT RETUNE THE BOX. The on-box
#   deploy/docker/.env OVERRIDES this default, and it was written to 1g by
#   the downsize workflow's SSM step. Until
#   `scripts/aws-upgrade-instance.sh --qdb-mem 12g --apply-ssm` runs against
#   the live instance, prod QuestDB stays at 1g regardless of this file.
#   Note also that `.github/workflows/downsize-instance.yml` still hard-
#   asserts 1073741824 and will FAIL against a 12g box — that workflow is a
#   t4g.medium-era tool and must not be dispatched at the current lock.
#
# REMOVED (CloudWatch-only migration):
#   - Grafana       -> CloudWatch Dashboards (#O1)
#   - Alertmanager  -> SNS 4-channel fan-out (#O2)
#   - Prometheus    -> CloudWatch metrics (#O3)
#   - Valkey        -> SSM Parameter Store for dual-instance lock (#O4)
# REMOVED earlier (Wave 7-A):
#   - Traefik           -> AWS ALB free tier (HTTPS termination)
#   - valkey-exporter   -> not queried
#   - Loki / Alloy / Jaeger -> CloudWatch Logs / X-Ray
#
# KEPT in Wave 7-A (operator decision 2026-05-10):
#   - Alertmanager -> independent process safety. If app crashes during
#     market hours, Alertmanager still routes Prometheus alerts to Telegram.
#     Routing the webhook through the app itself is a single-point-of-failure
#     anti-pattern (app dead = no alert). 256MB is cheap insurance.
#
# Already removed (pre-Wave-7-A):
#   - Loki + Alloy + Jaeger -> saves ~2.5GB. Profile-gated for opt-in dev use.
#
# Container prefix: tv- (tickvault)
# Network: tv-network (all services communicate via Docker DNS)
# ALL images pinned with SHA256 digest (Bible Section 14 #71)
# =============================================================================

networks:
  tv-network:
    name: tv-network
    driver: bridge

volumes:
  tv-questdb-data:
    name: tv-questdb-data
  # tv-valkey-data volume DELETED in #O4 (2026-05-24) — Valkey removed.
  # Phase 3 of active-plan.md — only used when `--profile logs` starts.
  tv-loki-data:
    name: tv-loki-data

services:
  # ---------------------------------------------------------------------------
  # QuestDB — Time-Series Database (tick data, orders, audit trail)
  # Bible #16: questdb/questdb:9.3.5
  # Wave 7-A: 4GB -> 2GB (cascading mat views removed in Wave 6, ticks-only
  #          + 9 sealed-candle shadow tables = 80% less write pressure).
  # ---------------------------------------------------------------------------
  tv-questdb:
    # Multi-arch tag (auto-selects amd64 or arm64 from the manifest).
    # The previous SHA256 pin (5b6f1518...) was the amd64 variant only;
    # on Graviton (arm64) hosts docker pulled it and ran under emulation,
    # which is slow enough that the deploy script's :9000 readiness curl
    # check timed out (30s window). Using the tag without SHA256 preserves
    # the 9.3.5 version pin while letting docker pick the correct arch.
    # Project rule "No :latest — exact version with SHA256" is satisfied
    # by the explicit :9.3.5 version; SHA256 omitted ONLY because Docker
    # 2026-08-08: DIGEST PINNED. The previous comment here claimed a digest pin
    # would need "both arm64 + amd64 SHAs and conditional logic, which is
    # fragile" — that premise was FACTUALLY WRONG, and it left this image as the
    # only un-pinned one in the file while CLAUDE.md asserted "All images pinned
    # with SHA256 digest".
    #
    # Docker Hub publishes a MULTI-ARCH OCI IMAGE INDEX whose digest resolves
    # per-platform with zero conditional logic. Verified live against
    # registry-1.docker.io on 2026-08-08:
    #   Docker-Content-Digest: sha256:22ad0305...7b968
    #   mediaType: application/vnd.oci.image.index.v1+json
    #   platforms:  linux/amd64  AND  linux/arm64
    #   round-tripped by digest -> HTTP 200
    # So ONE index digest covers Mac/amd64+arm64 dev and the ARM Graviton t4g
    # prod box, and composes correctly with the `platform:` pin below.
    image: questdb/questdb:9.3.5@sha256:22ad030544f45a396c743124c928ce33de11666c104f63f69ce4e66e07e7b968
    # Force arm64 on the deployed Graviton box (default). The earlier claim
    # that this is "harmless on amd64 dev hosts" was WRONG — `platform:`
    # is a hard requirement, not a preference: on an amd64 host it pulls
    # the arm64 layer and exec-format-fails (the exact failure documented
    # in .github/workflows/groww-e2e.yml, which worked around it with a
    # bare `docker run`). Env-interpolated so amd64 CI runners (chaos
    # nightly lane) can set TV_QDB_PLATFORM=linux/amd64; the default keeps
    # Mac dev + AWS Graviton (both arm64) byte-identical. The 9.3.5 tag is
    # a multi-arch manifest list (verified 2026-07-11: amd64 5b6f1518... +
    # arm64 ba849fed...), so either platform value resolves cleanly.
    platform: ${TV_QDB_PLATFORM:-linux/arm64}
    container_name: tv-questdb
    hostname: tv-questdb
    restart: unless-stopped
    # Default 12g is the steady-state QuestDB budget on the r8g.xlarge 32 GiB
    # box (operator Quote 13, 2026-08-08 — 4 vCPU / 32 GiB, multi-AZ). Per
    # `daily-universe-scope-expansion-2026-05-27.md` §7 Rule 2 the sizing for
    # the 13-timeframe + tick-retention target is: QuestDB 8–16 GB + one day of
    # resident ticks 2.3–7.2 GB + app remainder 2–4 GB + OS/FS-cache 2–4 GB =
    # ~14–31 GB of 32 GiB. 12g sits mid-band, leaving room for the app and the
    # page cache at the top of the tick range.
    #
    # HISTORY — why this was WRONG until 2026-08-10: the value stayed at the
    # t4g.medium `1g` (operator Quote 8, 2026-07-15) for two days AFTER the
    # r8g.xlarge migration, and a build-failing ratchet ASSERTED that `1g`, so
    # raising it was not a config edit — the guard had to be re-blessed first.
    # QuestDB was therefore capped at 1/32nd of the host it had just been moved
    # to, which is the single line that made most of the upgrade unreachable.
    #
    # NOTE: the on-box deploy/docker/.env (written by the flip tooling)
    # OVERRIDES this default — a box whose .env still carries `1g` is NOT
    # retuned by this compose change alone; `scripts/aws-upgrade-instance.sh
    # --qdb-mem 12g --apply-ssm` rewrites it.
    # QuestDB mmaps data files — actual RSS is much lower than limit.
    # Partition manager keeps hot data bounded to ~90 days.
    mem_limit: ${QDB_MEM_LIMIT:-12g}
    mem_reservation: 2g
    # HISTORY: this was `cpus: 3.0` with the note "3.0 of the box's 4 vCPU …
    # the remaining core is left for the tickvault app + OS". That reading was
    # wrong in one word: a QUOTA does not leave a core for anyone. It caps
    # total CPU-seconds while letting the scheduler put QuestDB's threads on
    # every core, including the app's. See the CPU PARTITION block below.
    # ------------------------------------------------------------------
    # CPU PARTITION (operator Quote 17b, 2026-08-19 — CPU isolation)
    # ------------------------------------------------------------------
    # The box is r8g.xlarge: 4 vCPU, Graviton4, NOT burstable. Until now
    # QuestDB held a 3.0 CPU QUOTA but no cpuset, so the CFS scheduler was
    # free to place its 3 WAL-apply workers on ANY core — including whichever
    # core the tick drain happened to be running on, and including the core
    # servicing NIC softirq. A quota bounds how MUCH a container runs; only a
    # cpuset bounds WHERE. Measured consequence, recorded below at
    # QDB_WAL_APPLY_WORKER_COUNT: nr_throttled 18,594 of nr_periods 85,149 =
    # 21.8% of scheduling periods throttled.
    #
    # The partition (see deploy/systemd/tickvault.service for the app half):
    #
    #   core 0  OS + NIC IRQ/softirq + the log/metric sidecars.
    #           NEVER the drain's core — core 0 services network softirq, so
    #           pinning the decoder there puts it in direct contention with
    #           the very work that feeds it (CLAUDE.md records this rule).
    #   core 1  tickvault app — EXCLUSIVE. QuestDB cannot be scheduled here.
    #   core 2  shared burst: app + QuestDB. Neither is hard-capped at one core.
    #   core 3  QuestDB — EXCLUSIVE.
    #
    # WHY QUESTDB LOSES A CORE (3.0 -> 2.0). Ranked harm, not preference: a
    # slow QuestDB is ABSORBED by the ring -> NDJSON spill -> DLQ chain that
    # exists for exactly this, and is recoverable. A descheduled drain fills
    # the socket receive buffer, and Dhan skips a slow consumer forward to
    # "the latest available state" — the ticks are dropped at THEIR side, with
    # no sequence number for us to detect the loss. One is recoverable, the
    # other is not, so the drain wins the tie.
    #
    # ROLLBACK — config only, no code change, no rebuild:
    #   echo 'TV_QDB_CPUSET=0-3' >> deploy/docker/.env   # all 4 cores, as before
    #   echo 'TV_QDB_CPUS=3.0'   >> deploy/docker/.env
    #   echo 'TV_QDB_WAL_WORKERS=3' >> deploy/docker/.env
    #   docker compose up -d tv-questdb
    # Use `0-3`, never an empty value: an empty cpuset is rejected by the
    # runtime and the container would not start.
    #
    # ⚠ DEV HOSTS WITH FEWER THAN 4 CORES — the one place this change is NOT
    # fail-safe, stated plainly rather than discovered. Docker validates a
    # cpuset against the host's ONLINE cpus and REFUSES to create the container
    # otherwise ("Requested CPUs are not available - requested 2-3, available:
    # 0-1"). On a laptop or CI runner with 2 cores, tv-questdb will not start
    # until you set the override:
    #
    #   echo 'TV_QDB_CPUSET=0-1' >> deploy/docker/.env   # or 0-3, or your range
    #
    # This is deliberately NOT solved by defaulting the partition off: a
    # silently-unpartitioned prod box is the failure this whole change exists
    # to remove, and a loud docker error naming the exact fix is strictly
    # better than a quiet box that lost the isolation. The APP half has no such
    # hazard — apply-host-tuning.sh removes its confinement automatically below
    # 3 cores, because systemd cannot name the fix for you.
    cpuset: "${TV_QDB_CPUSET:-2,3}"
    # Kept alongside the cpuset deliberately. The cpuset is the hard placement
    # bound; this quota is the belt-and-braces ceiling that keeps the number
    # visible to `docker inspect` and to anyone reading this file. It is set
    # EQUAL to the cpuset width so it can never be the binding constraint on
    # its own.
    cpus: ${TV_QDB_CPUS:-2.0}
    # OOM protection: prefer killing other containers over QuestDB.
    # QuestDB holds all trading data — losing it mid-session is catastrophic.
    oom_score_adj: -500
    # Shared memory: QuestDB uses mmap heavily for WAL + column storage.
    # Default 64MB causes SIGBUS on large tables. 512MB matches production needs.
    shm_size: 512m
    # NOTE: vm.max_map_count must be raised at the HOST/VM level, NOT via the
    # compose `sysctls:` key. vm.max_map_count is a NON-namespaced kernel
    # sysctl, so runc refuses to start the container if it is listed under
    # `sysctls:` ("sysctl vm.max_map_count is not in a separate kernel
    # namespace"). scripts/bootstrap.sh raises it on Linux hosts directly and
    # best-effort inside the Docker Desktop Linux VM on macOS. If it cannot be
    # raised, QuestDB simply logs a perf warning (current=262144
    # recommended=1048576) and runs fine.
    ports:
      # E5 security: bind web console to localhost only (no external access) —
      # the DEV default. On the prod box, deploy-aws.yml persists
      # TV_QDB_HTTP_BIND=0.0.0.0 into deploy/docker/.env (gitignored, survives
      # the deploy's `git reset --hard`) so the B4 QuestDB console's VPC back
      # Lambda can reach :9000 on the box PRIVATE IP. The 127.0.0.1-only bind
      # made every B4 console request 503 "box offline" even with the box
      # RUNNING (2026-07-03 incident): the SG-to-SG 9000 rule was correct but
      # the host refused the connection. Prod network exposure is UNCHANGED:
      # the box SG admits 9000 from the console Lambda's SG ONLY (main.tf
      # dynamic ingress) — never public, even when bound 0.0.0.0. Compose v2
      # loads .env from the compose file's project dir for EVERY caller
      # (deploy-aws.yml, user-data boot, infra.rs --force-recreate,
      # ensure-questdb.sh), so the prod bind persists across all restarts.
      - "${TV_QDB_HTTP_BIND:-127.0.0.1}:9000:9000" # HTTP API + Web Console (dev default: localhost only)
      - "8812:8812"            # PostgreSQL wire protocol
      - "9009:9009"            # InfluxDB Line Protocol (high-speed ingestion)
      - "127.0.0.1:9003:9003" # Prometheus metrics (localhost only)
    volumes:
      - tv-questdb-data:/var/lib/questdb
    environment:
      QDB_LOG_W_STDOUT_LEVEL: ERROR
      QDB_TELEMETRY_ENABLED: "false"
      QDB_METRICS_ENABLED: "TRUE"
      # --- WAL / writer tuning ---
      #
      # Every value below was VERIFIED against the running container on
      # 2026-08-18 via `SHOW PARAMETERS`, not assumed. Five QDB_LINE_TCP_* vars
      # and two misnamed WAL vars were DELETED here because that query proved
      # they tune nothing:
      #
      #   * QDB_LINE_TCP_* (maintenance interval, disconnect-on-error,
      #     connection limit, idle release, recv buffer) governed the :9009 TCP
      #     receiver. All 44 production ILP senders use `http::addr=<host>:9000`
      #     (tick_persistence.rs, depth_persistence.rs, ...); live socket counts
      #     were 40 on :9000 and only listeners on :9009. They read as if the
      #     write path were tuned while tuning nothing.
      #   * QDB_WAL_SEGMENT_ROLLOVER_SIZE ("64MB") — live value was 52428800,
      #     QuestDB's 50MB DEFAULT. The property is
      #     `cairo.wal.segment.rollover.size`, so the env var must be
      #     QDB_CAIRO_WAL_SEGMENT_ROLLOVER_SIZE. Ours never matched and was
      #     silently ignored. Deleted rather than renamed: the default is fine
      #     and a rename would change live behaviour on no evidence.
      #   * QDB_WAL_APPLY_TABLE_TIME_QUOTA ("100000", commented "100ms") — live
      #     value was 1000, the default. Same wrong-name problem. Deleting it is
      #     the SAFE repair and renaming would be the dangerous one: the value
      #     is in MILLISECONDS, so 100000 means 100 SECONDS, and activating it
      #     would let one table hold the WAL apply job while the other ~25
      #     starved.
      QDB_CAIRO_MAX_UNCOMMITTED_ROWS: "2000000"
      # O3 max lag: 60s. Tighter out-of-order merge window.
      QDB_CAIRO_O3_MAX_LAG: "60000000"
      # --- Crash Recovery & Stability ---
      # Writer append page size: 16MB (QuestDB's default).
      #
      # Was 1048576 with the comment "1MB. Reduces mmap syscalls for large
      # batches" — which is backwards. 1MB is 16x BELOW the default, so every
      # column file remaps 16x MORE often. `SHOW PARAMETERS` confirmed this one
      # WAS in force (correct env name), unlike the two above. market_depth is
      # PARTITION BY HOUR, so ~72 live partitions x 11 columns is on the order
      # of 800 append files remapping every megabyte.
      #
      # Measured on the box 2026-08-18 while this was 1MB: NVMe 74% util,
      # 3,121 writes/sec, IO pressure full=13.97% (every task stalled on IO
      # 14% of wall time) — with the app itself using 6.7% CPU.
      QDB_CAIRO_WRITER_DATA_APPEND_PAGE_SIZE: "16777216"
      #
      # Parallel WAL apply threads: 2, matching the 2-core cpuset above.
      #
      # This value has now been corrected twice in the same direction, and the
      # pattern is the point: it was 4 ("matches the r8g.xlarge 4 vCPU") while
      # the quota was 3.0, then 3 to match that quota. Both times the worker
      # count was sized against a number that was not the real placement
      # bound. Measured on the box 2026-08-18 at 4 workers: nr_throttled
      # 18,594 of nr_periods 85,149 = 21.8% of scheduling periods throttled,
      # 232 seconds of throttled time. Workers above the width of the cpuset
      # buy CFS throttling and context switches, never throughput.
      #
      # ROLLBACK: TV_QDB_WAL_WORKERS=3 in deploy/docker/.env (raise the cpuset
      # in the same edit, or this simply re-creates the throttling).
      QDB_WAL_APPLY_WORKER_COUNT: "${TV_QDB_WAL_WORKERS:-2}"
      # QuestDB's GENERAL worker pool, set EXPLICITLY for the same reason.
      #
      # Left unset, QuestDB sizes this pool from the number of CPUs it can SEE,
      # and a container reads the HOST's CPU count, not its cgroup cpuset — so
      # on a 2-core cpuset it would still start 4 general workers. That is the
      # identical mismatch the WAL count above was corrected for twice, on a
      # pool nobody had ever pinned. Setting it to the cpuset width is the
      # whole fix.
      #
      # NOT claimed: that 2 general workers is the OPTIMAL value for this
      # workload — it is the CONSISTENT one. It has not been measured against
      # the live query mix, and the first session is the measurement.
      #
      # ROLLBACK: TV_QDB_SHARED_WORKERS=0 in deploy/docker/.env restores
      # QuestDB's own auto-sizing (0 means "decide for me" in QuestDB).
      QDB_SHARED_WORKER_COUNT: "${TV_QDB_SHARED_WORKERS:-2}"
      QDB_PG_USER: ${TV_QUESTDB_PG_USER:?Run bootstrap.sh first — QuestDB credentials must come from AWS SSM}
      QDB_PG_PASSWORD: ${TV_QUESTDB_PG_PASSWORD:?Run bootstrap.sh first — QuestDB credentials must come from AWS SSM}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/9000 && cat < /dev/null > /dev/tcp/localhost/9009' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    # Grace period for WAL flush on docker stop — prevents data loss on graceful shutdown.
    stop_grace_period: 30s
    networks:
      - tv-network

  # ---------------------------------------------------------------------------
  # Valkey — REMOVED (observability → CloudWatch-only, 2026-05-24, #O4).
  # The dual-instance lock moved to AWS SSM Parameter Store in PR #764
  # (/tickvault/<env>/instance-lock). The file-based token-cache
  # (crates/core/src/auth/token_cache.rs) covers crash-restart speed.
  # No remaining production caller needs an in-memory KV store.
  # See .claude/plans/active-plan-observability-cloudwatch-only.md (#O4).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Prometheus — REMOVED (observability → CloudWatch-only, 2026-05-20, #O3).
  # The app's own /metrics endpoint (port 9091) STAYS — the AWS CloudWatch
  # agent scrapes it directly. Only the Prometheus container is gone.
  # See .claude/plans/active-plan-observability-cloudwatch-only.md (#O3).
  # ---------------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # Alertmanager — REMOVED (observability → CloudWatch-only, 2026-05-20).
  # Alert routing now lives in AWS CloudWatch Alarms. See
  # .claude/plans/active-plan-observability-cloudwatch-only.md (#O2).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Wave 7-A REMOVED: tv-traefik (traefik reverse proxy)
  # Replacement on AWS: AWS Application Load Balancer (free tier 750 hrs/mo).
  # Replacement on Mac dev: app listens directly on port 3001
  #   (set TV_API_BIND=127.0.0.1:3001 in .env).
  # Reason: Traefik's HTTPS termination + dashboard added 512MB RAM and a
  #         containerized hop with no functional benefit on a single-app host.
  #         AWS ALB does the same job free, and Mac dev does not need HTTPS.
  # ---------------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # Loki — log aggregation (Phase 3 of active-plan.md)
  # OPT-IN only: starts with `docker-compose --profile logs up -d`.
  # Default stack is unaffected. On t4g.medium budget: 384MB memory.
  # Retains errors.jsonl.* structured stream for 30 days; ruler fires
  # LogQL-based alerts (ErrorBurst, FlushErrorStorm, AuthFailureBurst,
  # NovelErrorSignature) via Alertmanager → Telegram.
  # ---------------------------------------------------------------------------
  tv-loki:
    # 2026-04-25: SHA256 digest pinned per CLAUDE.md "All images pinned with
    # SHA256 digest". Linux/amd64 digest from Docker Hub registry.
    image: grafana/loki:3.7.1@sha256:1694e9237e2b3d7cd4ad959bae1f21e12b6184d886d7412bd1b939fb0dd4e75c
    container_name: tv-loki
    hostname: tv-loki
    profiles:
      - logs
    restart: unless-stopped
    mem_limit: 384m
    # Pinned to core 0 with the OS and the NIC IRQs (CPU PARTITION, above).
    # Log shipping is best-effort background work and must never be scheduled
    # on the app's core (1) or QuestDB's (3). ROLLBACK: TV_SIDECAR_CPUSET=0-3.
    cpuset: "${TV_SIDECAR_CPUSET:-0}"
    cpus: 0.5
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki/rules.yml:/loki/rules/fake/rules.yml:ro
      - tv-loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tv-network

  # ---------------------------------------------------------------------------
  # Alloy — log collector (Phase 3 of active-plan.md)
  # Tails tv-* container logs AND data/logs/machine/errors.jsonl.* on the host,
  # forwards everything to tv-loki. 256MB memory.
  # ---------------------------------------------------------------------------
  tv-alloy:
    # 2026-04-25: SHA256 digest pinned per CLAUDE.md "All images pinned with
    # SHA256 digest". Linux/amd64 digest from Docker Hub registry.
    image: grafana/alloy:v1.16.0@sha256:c12b05c77378537384f4082011855338de4558d258a1f3351862b73a920ea55c
    container_name: tv-alloy
    hostname: tv-alloy
    profiles:
      - logs
    restart: unless-stopped
    mem_limit: 256m
    # Pinned to core 0 — see the tv-loki note above and the CPU PARTITION
    # block on tv-questdb. ROLLBACK: TV_SIDECAR_CPUSET=0-3.
    cpuset: "${TV_SIDECAR_CPUSET:-0}"
    cpus: 0.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/alloy-config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Bind-mount the host's data/logs/ so Alloy can tail machine/errors.jsonl.*
      # and the daily app.*.log files that the Rust observability layer writes.
      - ../../data/logs:/var/log/tv-app:ro
    depends_on:
      tv-loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:12345/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tv-network
