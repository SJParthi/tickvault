# Kernel network tuning for the tickvault market-data feed.
# Installed to /etc/sysctl.d/99-tickvault-net.conf by user-data on first boot.
# Managed by the repo — do not edit on the box; edit here and redeploy.
#
# WHY THIS FILE EXISTS (2026-08-10)
# ---------------------------------
# There was previously NO network tuning of any kind on this instance. A
# workspace-wide search for rmem_max, tcp_rmem, netdev_max_backlog, somaxconn,
# keepalive tunables, congestion control, swappiness and IRQ affinity returned
# nothing outside archived plans that were never implemented.
#
# That matters because net.core.rmem_max defaults to roughly 212 KB, and it is
# the single setting that silently loses market data: when the kernel receive
# queue fills, TCP shrinks the advertised window and the SERVER discards
# updates. Nothing downstream can recover that. The write-ahead log, the ring
# buffer and the spill files are all defensive layers over data we already
# received; this is the only layer that prevents loss at the source.
#
# Sizing target: ~75,000 packets/sec aggregate across the feed sockets, with a
# ~10x burst at the open and at expiry-day close. 128 MB of receive buffer
# absorbs a multi-second consumer stall at that rate instead of tens of
# milliseconds — less than a single GC pause or QuestDB flush hiccup.
#
# NOTE: this file lives in the repo rather than inline in user-data because EC2
# caps user-data at 16,384 bytes and the template was measured at 16,382 — two
# bytes of headroom. Inlining this content is what broke the terraform plan on
# 2026-08-10. See crates/common/tests/user_data_size_guard.rs.

# ---- Receive path: the anti-tick-loss settings ----
net.core.rmem_max = 134217728
net.core.rmem_default = 16777216
net.ipv4.tcp_rmem = 4096 1048576 134217728
net.ipv4.tcp_moderate_rcvbuf = 1

# ---- Send path (small — this is a read-mostly client) ----
net.core.wmem_max = 16777216
net.core.wmem_default = 4194304
net.ipv4.tcp_wmem = 4096 65536 16777216

# ---- Queueing: absorb NIC-to-stack bursts instead of dropping them ----
net.core.netdev_max_backlog = 65536
net.core.somaxconn = 4096

# ---- Do not collapse the congestion window across idle gaps or reconnects ----
# This matters exactly at the 09:15 open and after every reconnect.
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_slow_start_after_idle = 0

# ---- Half-open detection backstop ----
# 60 + 20*3 = 120 s to declare a dead peer. This is DELIBERATELY SLOWER than
# the application's own 27 s idle watchdog: the app must always detect and
# re-dial on its own terms. TCP keepalive is the backstop for a half-open path
# the application layer cannot see, and it must never race the reconnect ladder.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 20
net.ipv4.tcp_keepalive_probes = 3

# ---- Headroom for reconnect churn across many sockets ----
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 2097152

# ---- Latency hygiene ----
vm.swappiness = 1
vm.max_map_count = 1048576

# BBR is NOT set here on purpose. It is a loadable module and is not guaranteed
# on every AL2023 kernel; an unavailable value makes `sysctl --system` fail as a
# whole and would silently strip the receive-buffer settings above along with
# it — the exact false-OK this tuning exists to prevent. user-data probes for it
# and writes 99-tickvault-bbr.conf separately only when the module loads.
