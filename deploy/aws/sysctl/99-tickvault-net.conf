# Kernel network tuning for the tickvault market-data feed.
# Installed to /etc/sysctl.d/99-tickvault-net.conf by user-data on first boot.
# Managed by the repo — do not edit on the box; edit here and redeploy.
#
# WHY THIS FILE EXISTS (2026-08-10)
# ---------------------------------
# There was previously NO network tuning of any kind on this instance. A
# workspace-wide search for rmem_max, tcp_rmem, netdev_max_backlog, somaxconn,
# keepalive tunables, congestion control, swappiness and IRQ affinity returned
# nothing outside archived plans that were never implemented.
#
# That matters because net.core.rmem_max defaults to roughly 212 KB, and it is
# the single setting that silently loses market data: when the kernel receive
# queue fills, TCP shrinks the advertised window and the SERVER discards
# updates. Nothing downstream can recover that. The write-ahead log, the ring
# buffer and the spill files are all defensive layers over data we already
# received; this is the only layer that prevents loss at the source.
#
# Sizing target: ~75,000 packets/sec aggregate across the feed sockets, with a
# ~10x burst at the open and at expiry-day close. 128 MB of receive buffer
# absorbs a multi-second consumer stall at that rate instead of tens of
# milliseconds — less than a single GC pause or QuestDB flush hiccup.
#
# NOTE: this file lives in the repo rather than inline in user-data because EC2
# caps user-data at 16,384 bytes and the template was measured at 16,382 — two
# bytes of headroom. Inlining this content is what broke the terraform plan on
# 2026-08-10. See crates/common/tests/user_data_size_guard.rs.

# ---- CONNECTION-COUNT BUDGET — 16 WEBSOCKETS ON r8g.xlarge (2026-08-11) ----
#
# rmem_max is a PER-SOCKET CEILING, not a total. It was sized on 2026-08-10 for
# a ONE-connection feed. The 2026-08-09 operator authorization raises the live
# WebSocket count to SIXTEEN (5 main-feed + 5 depth-20 + 5 depth-200 + 1
# order-update), so the ceiling has to be re-justified against the whole host:
#
#     16 sockets x 128 MiB ceiling = 2.00 GiB of kernel receive buffer
#
# With tcp_moderate_rcvbuf = 1 the kernel autotunes between the tcp_rmem default
# (1 MiB) and that max, so the STEADY state is ~16 MiB across all sixteen and the
# 2.00 GiB is the worst case, reached only when every socket is under sustained
# pressure at once. That is the 09:15 open shape, so it is budgeted as real.
#
# Whole-host budget on the locked r8g.xlarge (4 vCPU / 32 GiB, Graviton4 —
# daily-universe-scope-expansion-2026-05-27.md Quote 13, 2026-08-08):
#
#     QuestDB container cap (docker-compose QDB_MEM_LIMIT)   12.0 GiB
#     Kernel receive buffers, all 16 saturated                2.0 GiB
#     App: live candle slots + seal ring                      0.1 GiB
#     App: one day of ticks resident (ASSUMED 25-80 M/day)  2.3-7.2 GiB
#     App remainder (registry, ILP + audit buffers, tracing) 2.0-4.0 GiB
#     OS + page cache + kernel                               2.0-4.0 GiB
#     -----------------------------------------------------------------
#     TOTAL                                                20.4-29.3 GiB
#
# 16 sockets FIT: the low case leaves ~11.6 GiB spare, the high case ~2.7 GiB.
# The 2.00 GiB of socket buffer is 6.25% of RAM — the same arithmetic on the
# PREVIOUS t4g.medium (4 GiB) came to 50% of RAM, which is why this block used
# to forbid the full 16-socket bring-up outright. That prohibition is RETIRED
# because the instance lock moved, NOT because the risk was re-evaluated away:
# on a 4 GiB host it would be just as correct today.
#
# HONEST RESIDUAL, unchanged by the bigger box: the ticks-resident row is
# ASSUMED, not measured, and at the top of its range the headroom is 8%. The
# app still does not set SO_RCVBUF per connection (recorded unfixed in PR #1738),
# so the 2.00 GiB total is bounded by the kernel ceiling rather than by design.
# Measure tv_process_rss_bytes on the first 16-socket session; r8g.2xlarge
# (64 GiB) is the rip-cord.
#
# THIS BUDGET IS RATCHETED: crates/app/tests/kernel_tuning_16ws_guard.rs
# recomputes it from this file, the compose QuestDB cap and the instance lock, so
# an instance downsize or a QuestDB cap raise fails the build here rather than
# rotting silently the way QDB_MEM_LIMIT=1g did.
#
# ---- Receive path: the anti-tick-loss settings ----
net.core.rmem_max = 134217728
net.core.rmem_default = 16777216
net.ipv4.tcp_rmem = 4096 1048576 134217728
net.ipv4.tcp_moderate_rcvbuf = 1

# ---- Send path (small — this is a read-mostly client) ----
net.core.wmem_max = 16777216
net.core.wmem_default = 4194304
net.ipv4.tcp_wmem = 4096 65536 16777216

# ---- Queueing: absorb NIC-to-stack bursts instead of dropping them ----
# netdev_max_backlog is PER-CPU. At the ~75,000 pps aggregate sizing target this
# is ~0.87 s of buffering before the stack starts dropping — enough to ride out a
# scheduler hiccup, not so deep that a stalled consumer hides behind it.
net.core.netdev_max_backlog = 65536
# somaxconn is a LISTEN backlog and does NOTHING for the sixteen OUTBOUND feed
# sockets. It is kept and checked because the app also serves the operator API on
# 3001, where a stock 128 is a real ceiling under reconnect churn. Stated plainly
# so nobody reads a passing somaxconn check as evidence the feed is healthy.
net.core.somaxconn = 4096

# ---- Softirq poll budget: sized for 4 vCPU, not for the old 2 ----
# One NAPI poll drains at most netdev_budget packets across all queues before
# yielding. The stock 300 is a ~4 ms slice at the sizing target, so at the open
# the backlog above fills faster than it drains and the deepened queue buys
# nothing. Raised in step with the vCPU count on the locked instance; the usecs
# ceiling keeps a busy poll from starving other softirq work on a 4-core box.
net.core.netdev_budget = 1200
net.core.netdev_budget_usecs = 8000

# ---- Atomic-allocation headroom ----
# Receive-path skb allocation is GFP_ATOMIC and cannot reclaim. The kernel's own
# default on 32 GiB lands near 64 MB, which is thin when QuestDB is holding a
# 12 GiB working set: an allocation failure here is a DROPPED PACKET, the one
# loss class no downstream buffer can recover.
vm.min_free_kbytes = 262144

# ---- Do not collapse the congestion window across idle gaps or reconnects ----
# This matters exactly at the 09:15 open and after every reconnect.
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_slow_start_after_idle = 0

# ---- Half-open detection backstop ----
# 60 + 20*3 = 120 s to declare a dead peer. This is DELIBERATELY SLOWER than
# BOTH application-layer deadlines, and must stay that way:
#
#   27 s  app idle watchdog (websocket/idle_watchdog) — our own reconnect trigger
#   40 s  Dhan's ping deadline: the server pings every 10 s and CLOSES the
#         connection if the client has not responded within 40 s. Documented for
#         BOTH the live feed (docs/dhan-ref/03) and full market depth (04), so it
#         binds all fifteen market-data sockets, not just the main feed.
#  120 s  this keepalive ladder — the backstop, last to fire by design
#
# Ordering matters more than the values: TCP keepalive exists for a half-open
# path the application layer cannot see. If it ever fired FIRST it would tear
# down sockets the app was about to recover on its own terms, turning a
# recoverable stall into a reconnect storm across sixteen connections at once.
# Pinned by kernel_tuning_16ws_guard.rs.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 20
net.ipv4.tcp_keepalive_probes = 3

# ---- Headroom for reconnect churn across many sockets ----
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 2097152

# ---- Latency hygiene ----
vm.swappiness = 1
vm.max_map_count = 1048576

# BBR is NOT set here on purpose. It is a loadable module and is not guaranteed
# on every AL2023 kernel; an unavailable value makes `sysctl --system` fail as a
# whole and would silently strip the receive-buffer settings above along with
# it — the exact false-OK this tuning exists to prevent. user-data probes for it
# and writes 99-tickvault-bbr.conf separately only when the module loads.
