# tickvault — cargo-nextest configuration
#
# Caps per-test wall-clock so runaway / hung tests are terminated and
# fail fast instead of blowing the 30-minute step budget on CI. The
# project's lib tests are all in-memory or mock-server based; any
# individual test running longer than a minute is almost certainly
# blocked on a network read that was supposed to be mocked.
#
# `terminate-after` gives the test 10 seconds to print its panic hook
# before nextest SIGKILLs it.

# `flaky-result` (profile.ci below) needs nextest 0.9.131 or later. An older
# nextest would ignore that key and let a flaky test pass silently again, so
# it must refuse to run instead (exit 92, REQUIRED_VERSION_NOT_MET). CI
# installs the latest release through taiki-e/install-action.
nextest-version = { required = "0.9.131" }

[profile.default]
# Per-test timeout. Tests that exceed this are killed and reported FAIL.
slow-timeout = { period = "60s", terminate-after = 2 }

# Per-test leak tolerance — kill any test still holding tokio tasks
# after a success / fail signal.
leak-timeout = "200ms"

# CI profile: inherits default + stricter reporting + bump thread count
# so nextest pegs all runner cores.
[profile.ci]
slow-timeout = { period = "90s", terminate-after = 2 }
leak-timeout = "500ms"
# A failing test is retried once so the log shows whether it is flaky, but a
# test that needed the retry FAILS the run (audit L2, 2026-10-04): before
# this a flaky test passed silently. Pinned by
# `crates/common/tests/shell_budget_guard.rs::nextest_ci_profile_fails_flaky_tests`.
retries = { backoff = "fixed", count = 1, delay = "1s" }
flaky-result = "fail"
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "slow"

# One test gets a longer limit, on purpose (2026-10-31). The WAL lifetime
# property test runs 256 randomized multi-boot lifetimes; it took about 326 s
# locally and the 90 s x 2 = 180 s kill above failed PRs at random (#2145's
# first run). Its cases must not be cut, skipped or ignored: it is the test
# that proves no unapplied frame is skipped or pruned across restarts. The
# override is in both profiles because an override beats a profile's own
# slow-timeout; every other test keeps the limits above.
[[profile.default.overrides]]
filter = "binary_id(tickvault-storage::wal_unapplied_ranges_properties) & test(=proptest_wal_lifetimes_never_skip_or_prune_an_unapplied_frame)"
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "binary_id(tickvault-storage::wal_unapplied_ranges_properties) & test(=proptest_wal_lifetimes_never_skip_or_prune_an_unapplied_frame)"
slow-timeout = { period = "300s", terminate-after = 2 }
