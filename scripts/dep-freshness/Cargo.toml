[package]
name = "tickvault-dep-freshness"
version = "0.1.0"
edition = "2024"
publish = false

# The hook must build without compiling the trading application or changing its lockfile.
[workspace]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
semver = "=1.0.27"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
toml_edit = "=0.25.17"
